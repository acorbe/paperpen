[project]
name = "paperpen"
version = "0.1.0"
description = "Read a paper on a tablet, mark it up with a pen, and send the notes back"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alessandro Corbetta"}]
requires-python = ">=3.10"
keywords = ["latex", "pdf", "annotation", "tablet", "synctex", "review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = ["flask>=3.0", "pymupdf>=1.24", "segno>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/acorbe/paperpen"
Source = "https://github.com/acorbe/paperpen"
Issues = "https://github.com/acorbe/paperpen/issues"

[project.scripts]
paperpen = "paperpen.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["paperpen", "paperpen.web"]

[tool.setuptools.package-data]
"paperpen.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# upstream/ is written in a style of its own, and is left out of the lint.
extend-exclude = ["upstream"]
