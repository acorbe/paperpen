// --- zooming the paper, and only the paper --------------------------------
//
// Resizing the pages around a point rather than scaling a picture of them:
// the point on the paper that was under the fingers stays under them, and
// the pages are the right size the moment the fingers lift. Which page the
// point is on, and where on it, is what is kept: the gaps between the pages
// do not grow with them, so a position down the whole column would drift.
const pagesHost = document.getElementById('pages');

function anchorAt(clientX, clientY) {
  let best = null, gap = 1e9;
  for (const el of document.querySelectorAll('.page')) {
    const r = el.getBoundingClientRect();
    const d = clientY < r.top ? r.top - clientY : clientY > r.bottom ? clientY - r.bottom : 0;
    if (d < gap) { gap = d; best = {el: el, r: r}; }
    if (!d) break;
  }
  if (!best) return null;
  return {el: best.el, fx: (clientX - best.r.left) / best.r.width,
          fy: (clientY - best.r.top) / best.r.height};
}

function zoomAround(scale, clientX, clientY, anchor) {
  ZSCALE = Math.min(ZMAX, Math.max(ZMIN, scale));
  const w = pageWidth();
  for (const el of document.querySelectorAll('.page')) el.style.setProperty('--w', w + 'px');
  document.getElementById('zoom-label').textContent = zoomLabel();
  if (!anchor) return;
  const r = anchor.el.getBoundingClientRect();
  pagesHost.scrollLeft += r.left + anchor.fx * r.width - clientX;
  pagesHost.scrollTop += r.top + anchor.fy * r.height - clientY;
}

// the buttons zoom about the middle of what is on screen
function zoomBy(factor) {
  const box = pagesHost.getBoundingClientRect();
  const cx = box.left + box.width / 2, cy = box.top + box.height / 2;
  let next = ZSCALE * factor;
  if (Math.abs(next - 1) < 0.04) next = 1;
  zoomAround(next, cx, cy, anchorAt(cx, cy));
  relayout();
}

document.getElementById('zoom-in').onclick = () => zoomBy(ZSTEP);
document.getElementById('zoom-out').onclick = () => zoomBy(1 / ZSTEP);

// Two fingers on the paper. Never while the pen is in play, and never with a
// palm among them: a hand resting on the glass beside the pen is two
// contacts, and zooming the page under a sentence being written is the worst
// thing this could do. The canvases redraw once, when the fingers lift; while
// they move the ink is the picture of itself, stretched.
let pinch = null;

function twoFingers(e) {
  if (e.touches.length !== 2) return null;
  const [a, b] = e.touches;
  if ([a, b].some(t => 2 * Math.max(t.radiusX || 0, t.radiusY || 0) > PALM_SIZE)) return null;
  return {d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
          x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2};
}

pagesHost.addEventListener('touchstart', (e) => {
  const two = twoFingers(e);
  if (!two || Date.now() - lastPenAt < PEN_GRACE || !two.d) return;
  e.preventDefault();
  pinch = {d: two.d, scale: ZSCALE, anchor: anchorAt(two.x, two.y)};
  // whatever the first finger had started is not happening now
  cancelHold(); cancelTapHint();
  tapFrom = null; lastTap = null; pan = null;
}, {passive: false});

pagesHost.addEventListener('touchmove', (e) => {
  if (!pinch) return;
  const two = twoFingers(e);
  if (!two) return;
  e.preventDefault();
  zoomAround(pinch.scale * two.d / pinch.d, two.x, two.y, pinch.anchor);
}, {passive: false});

for (const ev of ['touchend', 'touchcancel']) {
  pagesHost.addEventListener(ev, (e) => {
    if (!pinch || e.touches.length >= 2) return;
    pinch = null;
    if (Math.abs(ZSCALE - 1) < 0.04) ZSCALE = 1;
    relayout();
    if (!pad.hidden) placePad();
  });
}

// On an iPad the Pencil scrolls the page like a finger unless told not to, and
// the page is told only while the pen is seen hovering, which most iPads cannot
// report: so the page slid under the Pencil and the ink landed off the line.
// Safari marks a Pencil touch as a stylus, and that one is kept from scrolling
// wherever the pen writes; a finger still scrolls.
function writing(e) {
  return TOOL === 'pen' || !pad.hidden;
}
for (const ev of ['touchstart', 'touchmove']) {
  document.addEventListener(ev, (e) => {
    if (!writing(e)) return;
    if ([...e.changedTouches].some(t => t.touchType === 'stylus')
        && e.target.closest && e.target.closest('.page, #pad')) {
      e.preventDefault();
    }
  }, {passive: false});
}

let scrollDraw = null;
pagesHost.addEventListener('scroll', () => {
  if (scrollDraw) return;
  scrollDraw = requestAnimationFrame(() => { scrollDraw = null; drawAll(); });
}, {passive: true});

// Safari's own gesture events, which it fires for a pinch whatever the CSS says
for (const ev of ['gesturestart', 'gesturechange']) {
  document.addEventListener(ev, (e) => e.preventDefault(), {passive: false});
}

document.getElementById('finish').onclick = () => {
  const n = (META.open || []).length;
  if (!n) { toast('No new notes to send'); return; }
  if (!confirm('Send ' + n + ' note' + (n === 1 ? '' : 's') + ' to the paper repo and commit?')) return;
  const btn = document.getElementById('finish');
  btn.disabled = true;
  postJSON('/paper/' + PID + '/export')
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'unknown error');
      // the server says where the round went, because that is not always a
      // commit: a draft read for somebody else leaves as a marked-up PDF
      toast(data.said || (data.committed
              ? ('Committed ' + data.notes + ' notes in the paper repo')
              : ('Written, not committed: ' + (data.git || 'see the repo'))), 6000);
      load();
    })
    .catch(err => toast('Not sent: ' + err.message, 6000))
    .finally(() => { btn.disabled = false; });
};

document.getElementById('rebuild').onclick = () => {
  if (CUSTOM_BUILD) {
    toast('This paper has its own build command; run it from a terminal', 5000);
    return;
  }
  const btn = document.getElementById('rebuild');
  btn.disabled = true;
  toast('Building, this takes a moment', 60000);
  postJSON('/paper/' + PID + '/build')
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'unknown error');
      META = data; render(); showState();
      toast('Rebuilt: ' + data.build.pages + ' pages from ' + (data.build.commit || 'the working tree'));
    })
    .catch(err => toast('Build failed: ' + err.message, 8000))
    .finally(() => { btn.disabled = false; });
};

function showState() {
  const el = document.getElementById('state');
  if (!META || !META.built) { el.textContent = 'not built'; return; }
  const open = (META.open || []).length, past = (META.past || []).length;
  const every = open + past + (META.claude_notes || []).length;
  const hidden = every - allNotes().length;
  const chip = document.getElementById('fixes-chip');
  const waiting = allNotes().filter(n => waitingFixes(n).length).length;
  chip.hidden = !waiting;
  chip.textContent = 'Fixes (' + waiting + ')';
  showAgentAndCommit();
  el.innerHTML = META.build.pages + ' pages · built from <b>'
    + (META.build.commit || 'working tree') + '</b>'
    + (META.stale ? ' <span class="stale">· the source has moved on</span>' : '')
    + ' · ' + open + ' to send' + (past ? ', ' + past + ' sent before' : '')
    + (hidden ? ' · <span class="stale">' + hidden + ' hidden</span>' : '');
}

function load() {
  for (const b of document.querySelectorAll('#shows .tool')) {
    b.classList.toggle('on', !!SHOW[b.dataset.show]);
  }
  return fetch('/paper/' + PID + '/meta').then(r => r.json()).then(data => {
    if (!data.ok) throw new Error(data.error || 'unknown error');
    const first = META === null;
    META = data;
    if (first || !document.querySelector('.page')) render();
    else { placePins(); drawAll(); }
    showState();
  }).catch(err => toast('Could not read the paper: ' + err.message, 6000));
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!document.getElementById('searchbar').hidden) { closeSearch(); return; }
  if (!pad.hidden) padGuard();
  else sheetGuard();
});

// --- search ---------------------------------------------------------------
// Orderless, as emacs has it: the words in any order, !word for without, a
// capital to match case. The server reads every sentence of every page, and
// the matches are drawn where they are on the pages and listed, emacs's
// occur, each one a tap away.
const FOUND = {q: '', matches: [], at: -1, more: false};
let searchWait = null;

function openSearch() {
  const bar = document.getElementById('searchbar');
  bar.hidden = false;
  const q = document.getElementById('q');
  q.focus();
  q.select();
}

function closeSearch() {
  document.getElementById('searchbar').hidden = true;
  document.getElementById('occur').hidden = true;
  document.getElementById('q-list').classList.remove('on');
  FOUND.matches = []; FOUND.at = -1;
  drawHits();
}

function runSearch() {
  const q = document.getElementById('q').value.trim();
  if (q === FOUND.q) return;
  FOUND.q = q;
  if (!q) { FOUND.matches = []; FOUND.at = -1; drawHits(); drawOccur(); countHits(); return; }
  fetch('/paper/' + PID + '/search?q=' + encodeURIComponent(q))
    .then(r => r.json())
    .then(d => {
      if (FOUND.q !== q) return;             // typed on since
      FOUND.matches = d.matches || []; FOUND.more = !!d.more;
      FOUND.at = FOUND.matches.length ? 0 : -1;
      drawHits(); drawOccur(); countHits();
      if (FOUND.at >= 0) goToHit(0, false);
    })
    .catch(() => {});
}

function countHits() {
  const n = FOUND.matches.length;
  document.getElementById('q-count').textContent = !FOUND.q ? ''
    : n ? (FOUND.at + 1) + ' of ' + n + (FOUND.more ? '+' : '') : 'none';
}

function drawHits() {
  for (const old of document.querySelectorAll('.hitband')) old.remove();
  FOUND.matches.forEach((m, k) => {
    const el = document.querySelector('.page[data-page="' + m.page + '"]');
    if (!el || !META) return;
    const size = META.build.sizes[m.page - 1];
    for (const r of m.rects) {
      const band = document.createElement('div');
      band.className = 'hitband' + (k === FOUND.at ? ' now' : '');
      band.dataset.k = k;
      band.style.left = (100 * r[0] / size[0]) + '%';
      band.style.top = (100 * r[1] / size[1]) + '%';
      band.style.width = (100 * Math.max(r[2] - r[0], 3) / size[0]) + '%';
      band.style.height = (100 * Math.max(r[3] - r[1], 3) / size[1]) + '%';
      el.appendChild(band);
    }
  });
}

function drawOccur() {
  const box = document.getElementById('occur');
  box.innerHTML = '';
  FOUND.matches.forEach((m, k) => {
    const row = document.createElement('div');
    row.className = 'row' + (k === FOUND.at ? ' now' : '');
    const pg = document.createElement('span');
    pg.className = 'pg';
    pg.textContent = 'p. ' + m.page;
    const said = document.createElement('span');
    let at = 0;
    for (const [a, b] of m.spans || []) {
      if (a > at) said.appendChild(document.createTextNode(m.text.slice(at, a)));
      const mk = document.createElement('mark');
      mk.textContent = m.text.slice(a, b);
      said.appendChild(mk);
      at = b;
    }
    if (at < m.text.length) said.appendChild(document.createTextNode(m.text.slice(at)));
    row.append(pg, said);
    row.onclick = () => goToHit(k, true);
    box.appendChild(row);
  });
  if (FOUND.more) {
    const more = document.createElement('div');
    more.className = 'more';
    more.textContent = 'and more: another word narrows it';
    box.appendChild(more);
  }
}

function goToHit(k, fromList) {
  if (!FOUND.matches.length) return;
  FOUND.at = (k + FOUND.matches.length) % FOUND.matches.length;
  const m = FOUND.matches[FOUND.at];
  for (const b of document.querySelectorAll('.hitband')) {
    b.classList.toggle('now', Number(b.dataset.k) === FOUND.at);
  }
  for (const r of document.querySelectorAll('#occur .row')) r.classList.remove('now');
  const row = document.querySelectorAll('#occur .row')[FOUND.at];
  if (row) { row.classList.add('now'); if (!fromList) row.scrollIntoView({block: 'nearest'}); }
  bringIntoView({page: m.page, rect: m.rects[0]});
  countHits();
}

document.getElementById('find-btn').onclick = openSearch;
document.getElementById('q-close').onclick = closeSearch;
document.getElementById('q-next').onclick = () => goToHit(FOUND.at + 1);
document.getElementById('q-prev').onclick = () => goToHit(FOUND.at - 1);
document.getElementById('q-list').onclick = (e) => {
  const box = document.getElementById('occur');
  box.hidden = !box.hidden;
  e.target.classList.toggle('on', !box.hidden);
};
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(searchWait);
  searchWait = setTimeout(runSearch, 220);
});
document.getElementById('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(searchWait);
    if (document.getElementById('q').value.trim() !== FOUND.q) { runSearch(); return; }
    goToHit(FOUND.at + (e.shiftKey ? -1 : 1));
  }
});
// / or Ctrl+F opens it: the browser's own find has only images to search here
document.addEventListener('keydown', (e) => {
  const typing = e.target.closest && e.target.closest('input, textarea, select');
  if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f')) {
    e.preventDefault();
    openSearch();
  }
});

let resizeWait = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeWait);
  resizeWait = setTimeout(() => { if (META && META.built) relayout(); }, 120);
});
load();
</script>
