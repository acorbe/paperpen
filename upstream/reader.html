<script>
const PID = "{pid}";
const CUSTOM_BUILD = "{custom_build}" === "1";
const TAGS = ["SCIENCE", "LANGUAGE", "QUESTION", "TODO"];
let META = null, TOOL = "read", EDIT = null, PENDING = [];
const LAYOUT = {};  // page -> its sentences, its words and its figures
let GRAIN = 'sentence';  // what a tap picks out: a sentence or a single word
let SEL = null;       // what the note being written is about
// The zoom is continuous, as a pinch is, and counted from the width that fits
// the screen: 1 is fit. The buttons are steps along it.
let ZSCALE = 1;
const ZMIN = 0.5, ZMAX = 4, ZSTEP = 1.25;

function toast(msg, ms) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.hidden = true; }, ms || 2600);
}

function postJSON(url, body) {
  return fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'},
                     body: JSON.stringify(body || {})}).then(r => r.json());
}

// --- laying the pages out -------------------------------------------------
// One image per page at the size the PDF says, so a coordinate on screen is a
// coordinate in the document with one multiplication and no guessing.
function pageWidth() {
  return Math.min(window.innerWidth - 16, 1100) * ZSCALE;
}

function zoomLabel() {
  return Math.abs(ZSCALE - 1) < 0.01 ? 'fit' : Math.round(ZSCALE * 100) + '%';
}

// the sentences of a page are fetched as it comes into view: by the time a
// finger lands on one they are there, and a paper nobody scrolls to costs
// nothing
const pageWatch = ('IntersectionObserver' in window) ? new IntersectionObserver(
  (entries) => {
    for (const e of entries) {
      if (e.isIntersecting) loadLayout(Number(e.target.dataset.page));
    }
  }, {rootMargin: '400px'}) : null;

function render() {
  const host = document.getElementById('pages');
  if (!META || !META.built) {
    host.innerHTML = '<div class="empty">Nothing built yet.<br>'
      + 'Run <code>scripts/paper.py build ' + PID + '</code>, or press Rebuild.</div>';
    return;
  }
  const w = pageWidth();
  host.innerHTML = '';
  META.build.sizes.forEach((size, i) => {
    const n = i + 1;
    const el = document.createElement('div');
    el.className = 'page';
    el.dataset.page = n;
    el.style.setProperty('--w', w + 'px');
    el.style.aspectRatio = size[0] + ' / ' + size[1];
    el.innerHTML =
      '<img draggable="false" loading="' + (n <= 2 ? 'eager' : 'lazy') + '" alt="page ' + n + '" '
      + 'src="/paper/' + PID + '/page/' + n + '.png?scale=2&v='
        + encodeURIComponent(META.build.at) + '">'
      + '<canvas></canvas><span class="pageno">' + n + ' / ' + META.build.pages + '</span>';
    if (pageWatch) pageWatch.observe(el);
    const cv = el.querySelector('canvas');
    cv.addEventListener('pointerdown', (ev) => penDown(ev, el));
    cv.addEventListener('pointermove', (ev) => penMove(ev, el));
    cv.addEventListener('pointerup', penUp);
    cv.addEventListener('pointercancel', penCancel);
    host.appendChild(el);
  });
  relayout();
}

// Resizing and zooming must not rebuild the pages: throwing the <img> elements
// away and making new ones blanks the paper until each one decodes again, on
// every rotation and every time the keyboard comes up. Only the width changes.
function relayout() {
  const w = pageWidth();
  for (const el of document.querySelectorAll('.page')) el.style.setProperty('--w', w + 'px');
  document.getElementById('zoom-label').textContent = zoomLabel();
  drawAll();
  placePins();
}

// The page's own text, cut into sentences by the board. Fetched as a page
// comes into view, because a note has to be about a sentence and a tap has to
// know which one without a round trip in the way.
function loadLayout(page) {
  if (LAYOUT[page]) return Promise.resolve(LAYOUT[page]);
  LAYOUT[page] = {sentences: [], words: [], figures: []};  // claim it
  return fetch('/paper/' + PID + '/layout/' + page)
    .then(r => r.json())
    .then(d => {
      LAYOUT[page] = {sentences: d.sentences || [], words: d.words || [],
                      figures: d.figures || []};
      drawAll();
      return LAYOUT[page];
    })
    .catch(() => LAYOUT[page]);
}
const layoutOf = (page) => LAYOUT[page] || {sentences: [], words: [], figures: []};

// the sentence a point is on, or the nearest within a line's reach
function sentenceAt(page, x, y) {
  let best = null, gap = 1e9;
  for (const s of layoutOf(page).sentences) {
    for (const r of s.rects) {
      if (x >= r[0] - 2 && x <= r[2] + 2 && y >= r[1] - 1 && y <= r[3] + 1) return s;
      const dy = y < r[1] ? r[1] - y : (y > r[3] ? y - r[3] : 0);
      const dx = x < r[0] ? r[0] - x : (x > r[2] ? x - r[2] : 0);
      const d = dy + 0.3 * dx;
      if (d < gap) { gap = d; best = s; }
    }
  }
  return gap < 12 ? best : null;
}

// a word is a small target, so a near miss on the same line still counts
function wordAt(page, x, y) {
  let best = null, gap = 1e9;
  for (const w of layoutOf(page).words) {
    const r = w.r;
    if (x >= r[0] - 1 && x <= r[2] + 1 && y >= r[1] && y <= r[3]) return w;
    const dy = y < r[1] ? r[1] - y : (y > r[3] ? y - r[3] : 0);
    const dx = x < r[0] ? r[0] - x : (x > r[2] ? x - r[2] : 0);
    const d = dx + 3 * dy;   // the line matters more than the column
    if (d < gap) { gap = d; best = w; }
  }
  return gap < 10 ? best : null;
}

// figures are tried after the text: a band drawn a little generously must
// never take a tap away from the paragraph beside it
function figureAt(page, x, y) {
  for (const f of layoutOf(page).figures) {
    const r = f.rect;
    if (x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3]) return f;
  }
  return null;
}

// What a press picks out, by the grain in force: the same rule in Note mode
// and in Pen mode, so what a tap means never depends on which tool is up.
function pickUnderFinger(el, clientX, clientY) {
  const n = Number(el.dataset.page);
  const [x, y] = toPdf(el, clientX, clientY);
  const word = GRAIN === 'word' ? wordAt(n, x, y) : null;
  const sent = word ? null : sentenceAt(n, x, y);
  if (word) {
    SEL = {page: n, kind: 'word', rects: [word.r], text: word.t, sentence: word.s};
  } else if (sent) {
    SEL = {page: n, kind: 'sentence', from: sent.i, to: sent.i};
  } else {
    const fig = figureAt(n, x, y);
    if (!fig) { SEL = null; drawAll(); return null; }
    SEL = {page: n, kind: 'figure', rects: [fig.caption_rect], band: fig.rect,
           text: fig.caption, label: fig.label};
  }
  drawAll();
  return SEL;
}

function selectedSentences() {
  if (!SEL || SEL.kind !== 'sentence') return [];
  const list = layoutOf(SEL.page).sentences;
  const lo = Math.min(SEL.from, SEL.to), hi = Math.max(SEL.from, SEL.to);
  return list.filter(s => s.i >= lo && s.i <= hi);
}

function selectionRects() {
  if (!SEL) return [];
  if (SEL.kind === 'sentence') {
    return selectedSentences().reduce((all, s) => all.concat(s.rects), []);
  }
  return SEL.rects || [];
}

function selectionText() {
  if (!SEL) return '';
  if (SEL.kind === 'sentence') return selectedSentences().map(s => s.text).join(' ');
  return SEL.text || '';
}

// The line from the pad to the sentence it is about. Orthogonal, never
// diagonal, which is the house style for a note joined to its line: see
// scripts/annotate-paper.py, which draws the same join on paper.
function drawLeader(g, el, k) {
  if (pad.hidden || !padTarget || padTarget.page !== Number(el.dataset.page)) return;
  const rects = selectionRects();
  if (!rects.length) return;
  const box = el.getBoundingClientRect();
  const p = pad.getBoundingClientRect();
  // from the middle of the pad's nearest edge, to the near corner of the text
  const anchorY = (Math.min(...rects.map(r => r[1])) + Math.max(...rects.map(r => r[3]))) / 2;
  const anchorX = pad.offsetLeft > box.left + box.width / 2
    ? Math.max(...rects.map(r => r[2])) : Math.min(...rects.map(r => r[0]));
  const fromX = (p.left + p.width / 2 - box.left) / k;
  const fromY = (p.top < box.top + anchorY * k ? p.bottom : p.top) - box.top;
  g.save();
  g.strokeStyle = 'rgba(0,121,191,.75)';
  g.lineWidth = 1.6;
  g.setLineDash([5, 4]);
  g.beginPath();
  g.moveTo(anchorX * k, anchorY * k);
  g.lineTo(fromX * k, anchorY * k);     // across, then down: never a diagonal
  g.lineTo(fromX * k, fromY);
  g.stroke();
  g.setLineDash([]);
  g.beginPath();
  g.arc(anchorX * k, anchorY * k, 3.5, 0, 6.29);
  g.fillStyle = 'rgba(0,121,191,.9)';
  g.fill();
  g.restore();
}

// page coordinates <-> PDF points. The image is the page, so it is one scale.
function scaleOf(el) {
  const size = META.build.sizes[el.dataset.page - 1];
  return size[0] / el.getBoundingClientRect().width;
}
function toPdf(el, clientX, clientY) {
  const box = el.getBoundingClientRect();
  const k = scaleOf(el);
  return [(clientX - box.left) * k, (clientY - box.top) * k];
}

// What is drawn on the pages. This reading's notes are always there; earlier
// readings and Claude's own set can be turned off, because on a paper that has
// been through a few rounds they bury the text they are about.
const SHOW_STORE = 'paper-show';
// `answered` off: a sent note that is done or rejected is not drawn, so what is
// on the page is what is still waiting. `fixes` on: only the notes with a fix
// to choose, which after an answered round is the work there is.
let SHOW = {past: true, claude: true, answered: false, fixes: false, proposals: false};
// who writes notes of their own and answers rounds: claude, or codex. META says
// which are agents and which one runs for this paper; the names are what their
// notes and fixes are signed with.
function isAgent(by) { return !!by && ((META && META.agents) || ['claude']).indexOf(by) >= 0; }
function runnerName() { return (META && META.agent && META.agent.runner) || 'claude'; }
try {
  const saved = JSON.parse(localStorage.getItem(SHOW_STORE) || 'null');
  if (saved) SHOW = Object.assign(SHOW, saved);
} catch (err) {}

function answered(n) { return n.status === 'done' || n.status === 'rejected'; }

function allNotes() {
  if (!META) return [];
  let out = (META.open || []).slice();
  if (SHOW.past) {
    out = out.concat((META.past || []).filter(n => SHOW.answered || !answered(n)));
  }
  if (SHOW.claude) {
    out = out.concat((META.claude_notes || []).map(n => Object.assign({claude: true}, n)));
  }
  if (SHOW.fixes) out = out.filter(n => waitingFixes(n).length);
  // the agent's proposals are sent notes with an author: the Claude chip hides
  // them with the rest of Claude's, `proposals` shows nothing else
  if (!SHOW.claude) out = out.filter(n => !isAgent(n.by));
  if (SHOW.proposals) out = out.filter(n => isAgent(n.by) && !answered(n));
  return out;
}

function setShow(what, on) {
  SHOW[what] = on;
  try { localStorage.setItem(SHOW_STORE, JSON.stringify(SHOW)); } catch (err) {}
  for (const b of document.querySelectorAll('#shows .tool')) {
    b.classList.toggle('on', !!SHOW[b.dataset.show]);
  }
  placePins();
  drawAll();
  showState();
}

function placePins() {
  for (const el of document.querySelectorAll('.page')) {
    for (const old of el.querySelectorAll('.pin, .band')) old.remove();
  }
  // two notes on the same sentence would put their pins in the same place and
  // one would be unreachable, so each is nudged clear of the one before it
  const taken = [];
  allNotes().forEach((n, i) => {
    const el = document.querySelector('.page[data-page="' + n.page + '"]');
    if (!el) return;
    const size = META.build.sizes[n.page - 1];
    const pc = (v, total) => (100 * v / total) + '%';
    // a sentence that wraps gets a band per line, not one block over the lot
    for (const r of (n.rects && n.rects.length ? n.rects : [n.rect])) {
      const band = document.createElement('div');
      band.className = 'band' + (n.claude || isAgent(n.by) ? ' claude' : '')
        + (n.status === 'done' ? ' done' : '');
      band.style.left = pc(r[0], size[0]);
      band.style.top = pc(r[1], size[1]);
      band.style.width = pc(Math.max(r[2] - r[0], 3), size[0]);
      band.style.height = pc(Math.max(r[3] - r[1], 3), size[1]);
      el.appendChild(band);
    }
    const pin = document.createElement('button');
    pin.className = 'pin ' + (n.claude ? 'claude' : n.tag) + (n.status === 'done' ? ' done' : '')
      + (waitingFixes(n).length ? ' has-fix' : '') + (isAgent(n.by) ? ' proposal' : '');
    pin.textContent = n.claude ? 'C' : (i + 1);
    let px = n.rect[2], py = (n.rect[1] + n.rect[3]) / 2;
    while (taken.some(t => t.page === n.page
                           && Math.abs(t.x - px) < 13 && Math.abs(t.y - py) < 13)) {
      px += 13;                       // along the line first, then under it
      if (px > size[0] - 8) { px = n.rect[2]; py += 13; }
    }
    taken.push({page: n.page, x: px, y: py});
    pin.style.left = pc(px, size[0]);
    pin.style.top = pc(py, size[1]);
    pin.title = (n.note || 'handwritten').slice(0, 120);
    pin.onclick = (e) => { e.stopPropagation(); openNote(n); };
    el.appendChild(pin);
  });
}

// --- ink ------------------------------------------------------------------
// Strokes are kept in PDF points, so they survive a zoom, a rebuild at another
// size, and the trip to the page crop the export writes.
let stroke = null, strokePage = null, pan = null;
// A note whose ink has been taken up again: its strokes are PENDING while that
// lasts, and it is not drawn from the note as well, or a stroke rubbed out
// would still be there underneath.
let INK_EDIT = null;
// What the ink was before each stroke and each rub-out, so undo takes back
// either. Snapshots of the list rather than of the strokes: a finished stroke
// is never changed, only added or taken away, so sharing them is safe.
let INK_UNDO = [];
const UNDO_DEPTH = 200;

function remember(stack, strokes) {
  stack.push(strokes.slice());
  if (stack.length > UNDO_DEPTH) stack.shift();
}

function showInkButtons(on) {
  for (const id of ['ink-save', 'ink-undo', 'ink-clear']) {
    document.getElementById(id).hidden = !on;
  }
}

// Only the pages near the screen have a canvas the size of the page. iPad
// Safari caps the memory of all canvases on a page, around 384 MB, and past it
// a canvas is silently blank: a paper of twenty pages at the iPad's density
// was most of that, a zoom took it past, and ink was written where it did not
// show. A page far away gives its memory back and gets it again on the way.
const MOST_PIXELS = 8e6;

function nearScreen(box) {
  const reach = window.innerHeight;
  return box.bottom > -reach && box.top < window.innerHeight + reach;
}

function drawAll() {
  for (const el of document.querySelectorAll('.page')) {
    const cv = el.querySelector('canvas');
    const box = el.getBoundingClientRect();
    if (!box.width) continue;
    if (!nearScreen(box)) {
      if (cv.width > 1) { cv.width = 1; cv.height = 1; }
      continue;
    }
    // and no canvas past Safari's own ceiling for one, about 16.7 million
    // pixels: zoomed far in, the ink is drawn a little softer rather than not
    // drawn at all
    const dpr = Math.min(window.devicePixelRatio || 1,
                         Math.sqrt(MOST_PIXELS / (box.width * box.height)));
    cv.width = box.width * dpr;
    cv.height = box.height * dpr;
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, box.width, box.height);
    const k = 1 / scaleOf(el);
    const paint = (strokes, color) => {
      g.strokeStyle = color; g.lineWidth = 2; g.lineCap = 'round'; g.lineJoin = 'round';
      for (const st of strokes || []) {
        const pts = (st || []).filter(
          p => p && Number.isFinite(p[0]) && Number.isFinite(p[1]));
        if (!pts.length) continue;
        g.beginPath();
        pts.forEach((p, i) => i ? g.lineTo(p[0] * k, p[1] * k)
                                : g.moveTo(p[0] * k, p[1] * k));
        g.stroke();
      }
    };
    for (const n of allNotes()) {
      if (INK_EDIT && n.id === INK_EDIT.id) continue;
      if (n.page == el.dataset.page && n.ink && n.ink.length) {
        paint(n.ink, n.status === 'done' ? 'rgba(120,130,150,.7)' : 'rgba(217,48,37,.85)');
      }
    }
    if (Number(el.dataset.page) === strokePage) paint(PENDING, 'rgba(217,48,37,.95)');
    // what is about to be noted
    if (SEL && SEL.page === Number(el.dataset.page)) {
      if (SEL.kind === 'figure' && SEL.band) {
        const b = SEL.band;
        g.strokeStyle = 'rgba(0,121,191,.85)';
        g.lineWidth = 2;
        g.strokeRect(b[0] * k, b[1] * k, (b[2] - b[0]) * k, (b[3] - b[1]) * k);
        g.fillStyle = 'rgba(0,121,191,.10)';
        g.fillRect(b[0] * k, b[1] * k, (b[2] - b[0]) * k, (b[3] - b[1]) * k);
      }
      g.fillStyle = 'rgba(0,121,191,.22)';
      for (const r of selectionRects()) {
        g.fillRect(r[0] * k, r[1] * k, (r[2] - r[0]) * k, (r[3] - r[1]) * k);
      }
      drawLeader(g, el, k);
    }
  }
}

function penDown(e, el) {
  if (TOOL !== 'pen') return;
  const host = document.getElementById('pages');
  // The pen draws; the finger pans, and a press that does not travel picks
  // out what the ink is going to be about. A palm on the glass never puts a
  // line through the paper either way.
  if (e.pointerType === 'touch') {
    if (isPalm(e)) return;   // a hand resting while the pen writes
    // While the pen is near, the surface is locked to it and a finger drag has
    // to be panned by hand. The rest of the time the browser is doing the
    // scrolling itself, inertia and all, and must not be fought over.
    const locked = document.body.classList.contains('pen-near');
    pan = {x: e.clientX, y: e.clientY, left: host.scrollLeft, top: host.scrollTop,
           at: Date.now(), page: Number(el.dataset.page), el: el, moved: 0,
           drag: locked};
    return;
  }
  if (isEraser(e)) {
    // the button rubs out marks made on the page, the same as in the pad
    e.preventDefault();
    const [x, y] = toPdf(el, e.clientX, e.clientY);
    const reach = ERASER_R * scaleOf(el);
    const [kept, changed] = rubOut(PENDING, x, y, reach);
    if (changed) {
      remember(INK_UNDO, PENDING);
      PENDING = kept;
      // rubbing out all of a note's ink is a change to keep, not a clear
      if (!PENDING.length && !INK_EDIT) clearInk(); else drawAll();
    }
    return;
  }
  if (strokePage && Number(el.dataset.page) !== strokePage) {
    toast('Keep or clear the ink before marking another page');
    return;
  }
  e.preventDefault();
  strokePage = Number(el.dataset.page);
  stroke = [toPdf(el, e.clientX, e.clientY)];
  remember(INK_UNDO, PENDING);
  PENDING.push(stroke);
  try { el.querySelector('canvas').setPointerCapture(e.pointerId); } catch (err) {}
}

function penMove(e, el) {
  if (pan && e.pointerType === 'touch') {
    pan.moved = Math.max(pan.moved,
      Math.abs(e.clientX - pan.x) + Math.abs(e.clientY - pan.y));
    if (pan.drag) {
      const host = document.getElementById('pages');
      host.scrollLeft = pan.left - (e.clientX - pan.x);
      host.scrollTop = pan.top - (e.clientY - pan.y);
    }
    return;
  }
  if (!stroke || e.pointerType === 'touch') return;
  e.preventDefault();
  const [px, py] = toPdf(el, e.clientX, e.clientY);
  if (addPoint(stroke, px, py)) drawAll();
}

const TAP_SLOP = 10;    // px a finger may wander and still count as a press
// px of contact above which a touch is a hand, not a tip. iPad Safari reports a
// fingertip as 40 to 70 across, which at 38 made every finger a palm and every
// tap nothing; a resting palm is well past 90 on any tablet.
const PALM_SIZE = 90;
const PEN_GRACE = 1600; // ms after the pen was last seen that touch is ignored
let lastPenAt = 0;

// A hand resting on the glass is a big soft contact, and it arrives while the
// pen is in play. Either sign is enough to ignore it: the alternative is that
// putting your hand down to write closes what you were writing in.
function isPalm(e) {
  if (e.pointerType !== 'touch') return false;
  if (Date.now() - lastPenAt < PEN_GRACE) return true;
  return Math.max(e.width || 0, e.height || 0) > PALM_SIZE;
}

// The S Pen's side button is the eraser, and it says so the way the spec says:
// pointerType "pen" with the barrel bit set, or "eraser" outright on the
// devices that report it that way. Held down, the pen rubs out instead of
// writing, which is what the button does everywhere else on the tablet.
const ERASER_R = 16;   // px around the tip that is rubbed out
// The button values this pen sends when it is only writing. Filled from the
// first contacts of a session and never emptied: a pen that always says 2 has
// 2 as its resting state, and its button will say something else.
const penBaseline = new Set();
penBaseline.calibrating = true;
let penContacts = 0;

function learnPen(e) {
  if (e.pointerType !== 'pen' || !e.buttons) return;
  if (penContacts < 3) {      // the first few contacts of a session set it
    penBaseline.add(e.buttons);
  }
}

const MODE_STORE = 'paper-pen-mode';
let PEN_MODE = 'write';
try { PEN_MODE = localStorage.getItem(MODE_STORE) || 'write'; } catch (err) {}
let sawPenButton = false;

function setPenMode(mode) {
  PEN_MODE = mode;
  try { localStorage.setItem(MODE_STORE, mode); } catch (err) {}
  for (const b of document.querySelectorAll('.pad-mode .pm')) {
    b.classList.toggle('on', b.dataset.mode === mode);
  }
  padCanvas.classList.toggle('erasing', mode === 'erase');
}

// A pen's side button is not something to rely on: what it reports differs
// from device to device and some report nothing at all, which is why the pad
// carries two buttons of its own. Where it does report something, it is
// honoured, and the first time it is seen it says what it sent, so an
// unrecognised pen can be made to work rather than shrugged at.
function penButtonDown(e) {
  if (e.pointerType !== 'pen' && e.pointerType !== 'eraser') return false;
  // What a stylus sends for plain contact is not agreed on: some report 1,
  // some report 2, and treating anything but 1 as the button turns every
  // stroke on such a pen into an erase. So the pen is asked rather than
  // assumed: the first values it sends while writing are its idea of "no
  // button", and only something other than that counts as one.
  if (e.buttons && !penBaseline.size && penBaseline.calibrating) return false;
  const down = e.pointerType === 'eraser'
    || (e.buttons !== 0 && !penBaseline.has(e.buttons));
  if (down && !sawPenButton) {
    sawPenButton = true;
    toast('Pen button seen: ' + e.pointerType + ', buttons ' + e.buttons
          + '. Rubbing out.', 4000);
  }
  return down;
}

// erasing happens because the mode says so, or because the button is held
function isEraser(e) {
  return PEN_MODE === 'erase' || penButtonDown(e);
}

// strokes within reach of the tip, gone. Whole strokes rather than parts of
// them: a half-erased letter is worse than a missing one.
function rubOut(strokes, x, y, reach) {
  const keep = strokes.filter(st => !(st || []).some(
    p => Math.abs(p[0] - x) < reach && Math.abs(p[1] - y) < reach));
  return [keep, keep.length !== strokes.length];
}

// The pen is "in play" whenever it is seen at all, hovering included: the S Pen
// reports hover, and that is the moment the hand is coming down. While it is
// in play the page surface belongs to the pen; the rest of the time it belongs
// to the browser, which is what gives scrolling its momentum back.
let penNearTimer = null;

// Quiet unless there is something worth seeing: the resting state of a pen is
// not news, a button that has never been pressed is.
function showPenState(e) {
  const el = document.getElementById('pad-pen');
  if (!el) return;
  const odd = e.pointerType === 'eraser'
    || (e.buttons !== 0 && penBaseline.size && !penBaseline.has(e.buttons));
  el.textContent = odd ? (e.pointerType + ' b' + e.buttons) : '';
  el.classList.toggle('hot', odd);
}

function penSeen(e) {
  lastPenAt = Date.now();
  if (e) { learnPen(e); showPenState(e); }
  document.body.classList.add('pen-near');
  clearTimeout(penNearTimer);
  penNearTimer = setTimeout(() => {
    if (Date.now() - lastPenAt >= PEN_GRACE - 50) {
      document.body.classList.remove('pen-near');
    }
  }, PEN_GRACE);
}

for (const ev of ['pointerdown', 'pointermove', 'pointerup', 'pointerover']) {
  document.addEventListener(ev, (e) => {
    if (e.pointerType === 'pen' || e.pointerType === 'eraser') penSeen(e);
  }, true);
}

// the browser took the gesture for itself: no stroke, and no press either
function penCancel() {
  pan = null;
  stroke = null;
}

function penUp(e) {
  // a finger that pressed without travelling was pointing at something: take
  // that as what the ink is about, and leave the ink itself alone
  if (pan && e && e.pointerType === 'touch') {
    const still = pan.moved < TAP_SLOP && Date.now() - pan.at < 1200;
    // picking is a double tap now, handled once for both tools
    pan = null;
    return;
  }
  pan = null;
  if (!stroke) return;
  stroke = null;
  showInkButtons(true);
  drawAll();
}

function inkBounds() {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const s of PENDING) for (const p of s) {
    x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]);
    x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]);
  }
  return [x0, y0, x1, y1];
}

function clearInk() {
  PENDING = []; strokePage = null; stroke = null;
  INK_EDIT = null;
  INK_UNDO = [];
  showInkButtons(false);
  document.getElementById('ink-save').textContent = 'Keep the ink as a note';
  drawAll();
}

// Whether a note can still be changed: it is ours, and in the round that is
// open. One already sent is somebody's copy of what was said, and stays so.
function changeable(note) {
  return !!(note && note.id && !note.claude
            && (META.open || []).some(n => n.id === note.id));
}

// The note's own strokes, handed back to the pad to be added to or rubbed out.
// Moved to the pad's corner and the pad made big enough for them: they were
// written in a pad that may have been any size, and where in it they sat is
// not kept by anything downstream, which reads them from their own origin.
function rewriteHand(note) {
  if (!pad.hidden && !padGuard()) return;
  const hand = (note.hand || []).map(st => st.map(p => [p[0], p[1]]));
  closeSheet();
  SEL = {page: note.page, kind: 'note', text: note.anchor || '',
         rects: note.rects && note.rects.length ? note.rects : [note.rect]};
  openPad();
  PAD_EDIT = note;
  PAD_TAG = note.tag || 'AUTO';
  document.getElementById('pad-tag').value = PAD_TAG;
  document.getElementById('pad-about').textContent =
    (hand.length ? 'changing ' : 'writing on ') + note.id
    + (note.anchor ? ', about: ' + note.anchor : '');
  const pts = hand.flat();
  if (pts.length) {
    const edge = 12;
    const x0 = Math.min(...pts.map(p => p[0])), y0 = Math.min(...pts.map(p => p[1]));
    const w = Math.max(...pts.map(p => p[0])) - x0, h = Math.max(...pts.map(p => p[1])) - y0;
    HAND = hand.map(st => st.map(p => [p[0] - x0 + edge, p[1] - y0 + edge]));
    const around = pad.offsetWidth - padCanvas.getBoundingClientRect().width;
    pad.style.width = Math.min(window.innerWidth - 16,
                               Math.max(pad.offsetWidth, w + 2 * edge + around)) + 'px';
    padCanvas.style.height = Math.max(padCanvas.getBoundingClientRect().height,
                                      h + 3 * edge) + 'px';
  }
  PAD_WAS = JSON.stringify(HAND);
  placePad();
  drawPad();
  drawAll();
}

// The note's ink, on the page, live again: the pen adds to it and its button,
// or Rub out, takes strokes away. Keeping it goes back through the note's own
// panel, so the words and the handwriting travel with it unchanged.
function reinkNote(note) {
  if (PENDING.length && !INK_EDIT) {
    toast('Keep or clear the ink already on the page first');
    return;
  }
  closeSheet();
  INK_EDIT = note;
  PENDING = (note.ink || []).map(st => st.map(p => [p[0], p[1]]));
  strokePage = note.page;
  INK_UNDO = [];                  // undo goes back as far as the note, no further
  setTool('pen');
  document.getElementById('ink-save').textContent = 'Keep the changed ink';
  showInkButtons(true);
  drawAll();
  bringIntoView(note);
  toast('The ink of ' + note.id + ' is live: write to add, rub out to take away', 4000);
}

// --- the note sheet -------------------------------------------------------
function openNote(note) {
  EDIT = Object.assign({}, note);
  document.getElementById('sheet-title').textContent =
    note.claude ? "Claude's note" : (note.id ? 'Note ' + note.id : 'New note');
  const where = note.source && note.source.file
    ? note.source.file + ':' + note.source.line : 'page ' + note.page;
  document.getElementById('sheet-where').textContent = where;
  document.getElementById('sheet-quote').textContent = note.anchor || '';
  document.getElementById('sheet-quote').hidden = !note.anchor;
  // a selection can be widened to the sentences either side of it, which is
  // how a note ends up being about two of them rather than one
  const grow = document.getElementById('sheet-grow');
  grow.hidden = !(SEL && !note.claude && !note.id);
  if (!grow.hidden) showSelectionState();
  const inkMark = document.getElementById('sheet-ink');
  inkMark.hidden = !(note.ink && note.ink.length);
  inkMark.textContent = (note.ink && note.ink.length && note.anchor)
    ? 'ink, about this' : 'with ink';
  const text = document.getElementById('sheet-text');
  text.value = note.note || '';
  text.disabled = !!note.claude;
  for (const b of document.querySelectorAll('#sheet-tags .tag')) {
    b.classList.toggle('on', b.dataset.tag === (note.tag || 'AUTO'));
  }
  document.getElementById('sheet-save').hidden = !!note.claude;
  document.getElementById('sheet-del').hidden = !!note.claude || !note.id
    || (META.past || []).some(p => p.id === note.id);
  // A note already taken can be gone back into: its handwriting in the pad,
  // its ink on the page. A typed note can be written on the same way.
  const redo = document.getElementById('sheet-redo');
  const hasHand = !!(note.hand && note.hand.length), hasInk = !!(note.ink && note.ink.length);
  const canChange = changeable(note);
  redo.hidden = !note.id || note.claude || !(canChange || hasHand || hasInk);
  const rewrite = document.getElementById('sheet-rewrite');
  rewrite.hidden = !canChange;
  rewrite.textContent = hasHand ? 'Change the handwriting' : 'Write on it';
  document.getElementById('sheet-reink').hidden = !(canChange && hasInk);
  document.getElementById('sheet-redo-said').textContent = canChange ? ''
    : 'Sent with an earlier round: its handwriting and ink stay as they were sent.';
  document.getElementById('sheet').hidden = false;
  showFixes(note);
  // The panel comes up from the bottom and its Save is at the foot of it,
  // which after Keep the ink as a note is the far end of the screen from the
  // hand that pressed it. So the same Save is also put just under the bar.
  document.getElementById('quick-save').hidden = !!note.claude
    || !!(note.id && !changeable(note));
  placeQuickSave();
  showNav(note);
  showHand(note);
  if (!note.claude && !(note.hand && note.hand.length)) {
    setTimeout(() => text.focus(), 60);
  }
}

// what the note is about, said in the sheet before it is saved, so a note
// that caught the wrong thing is visible as such
function showSelectionState() {
  const sentenceSel = SEL && SEL.kind === 'sentence';
  for (const b of document.querySelectorAll('.grow-sel button[data-grow]')) {
    b.hidden = !sentenceSel;
  }
  const widen = document.getElementById('sheet-widen');
  widen.hidden = !(SEL && SEL.kind === 'word' && SEL.sentence >= 0);
  const label = document.getElementById('sheet-seln');
  if (!SEL) { label.textContent = ''; return; }
  if (SEL.kind === 'word') label.textContent = 'the word "' + SEL.text + '"';
  else if (SEL.kind === 'figure') label.textContent = SEL.label;
  else {
    const n = Math.abs(SEL.to - SEL.from) + 1;
    label.textContent = n === 1 ? 'one sentence' : n + ' sentences';
  }
}

function refreshQuote() {
  const text = selectionText();
  document.getElementById('sheet-quote').textContent = text;
  document.getElementById('sheet-quote').hidden = !text;
  if (EDIT) {
    EDIT.rects = selectionRects();
    EDIT.anchor = text;
    EDIT.kind = SEL ? SEL.kind : 'region';
  }
  showSelectionState();
}

// A note's own handwriting, drawn back into the panel so you can see what you
// wrote. Scaled to fit, since the pad it was written in may have been any size.
function showHand(note) {
  const cv = document.getElementById('sheet-hand');
  const hand = note.hand || [];
  cv.hidden = !hand.length;
  if (!hand.length) return;
  const box = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(box.width * dpr));
  cv.height = Math.max(1, Math.round(box.height * dpr));
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, box.width, box.height);
  const pts = hand.flat();
  if (!pts.length) return;
  const x0 = Math.min(...pts.map(p => p[0])), x1 = Math.max(...pts.map(p => p[0]));
  const y0 = Math.min(...pts.map(p => p[1])), y1 = Math.max(...pts.map(p => p[1]));
  const pad = 8;
  const k = Math.min((box.width - 2 * pad) / Math.max(x1 - x0, 1),
                     (box.height - 2 * pad) / Math.max(y1 - y0, 1), 1.4);
  g.strokeStyle = 'rgba(217,48,37,.95)';
  g.lineWidth = 2; g.lineCap = 'round'; g.lineJoin = 'round';
  for (const st of hand) {
    g.beginPath();
    st.forEach((p, i) => {
      const x = pad + (p[0] - x0) * k, y = pad + (p[1] - y0) * k;
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    });
    g.stroke();
  }
}

// the same question the pad asks, for the window below it
function sheetGuard() {
  const text = document.getElementById('sheet-text');
  const typed = text && !text.disabled && text.value.trim();
  const unsaved = EDIT && typed && typed !== (EDIT.note || '').trim();
  if (unsaved && !confirm('This note is not saved. OK closes it anyway, '
                          + 'Cancel goes back to it.')) {
    return false;
  }
  closeSheet();
  return true;
}

// The notes on show, in the order they sit on the pages: what the arrows in
// the panel step through, so two notes on one sentence are both reachable.
function notesInOrder() {
  return allNotes().slice().sort((a, b) =>
    (a.page - b.page) || ((a.rect && a.rect[1]) || 0) - ((b.rect && b.rect[1]) || 0));
}

function showNav(note) {
  const nav = document.getElementById('sheet-nav');
  const list = notesInOrder();
  const at = list.findIndex(n => n.id === note.id);
  nav.hidden = !(note.id && list.length > 1);
  if (nav.hidden) return;
  document.getElementById('sheet-count').textContent = (at + 1) + ' of ' + list.length;
  document.getElementById('sheet-prev').disabled = at <= 0;
  document.getElementById('sheet-next').disabled = at < 0 || at >= list.length - 1;
}

function stepNote(by) {
  const list = notesInOrder();
  const at = list.findIndex(n => EDIT && n.id === EDIT.id);
  const next = list[at + by];
  if (!next) return;
  openNote(next);
  bringIntoView(next);
}

// put the note's own place on screen, so stepping actually goes somewhere
function bringIntoView(note) {
  const el = document.querySelector('.page[data-page="' + note.page + '"]');
  if (!el || !note.rect) return;
  const host = document.getElementById('pages');
  const box = el.getBoundingClientRect();
  const k = box.width / META.build.sizes[note.page - 1][0];
  const y = box.top - host.getBoundingClientRect().top + host.scrollTop + note.rect[1] * k;
  host.scrollTo({top: Math.max(0, y - host.clientHeight / 3), behavior: 'smooth'});
}

// under the button that was pressed when it is on show, the ink's Keep;
// otherwise under the right-hand end of the bar
function placeQuickSave() {
  const quick = document.getElementById('quick-save');
  if (quick.hidden) return;
  const bar = document.querySelector('.tools').getBoundingClientRect();
  const keep = document.getElementById('ink-save');
  const under = keep.hidden ? null : keep.getBoundingClientRect();
  const w = quick.offsetWidth || 90;
  const left = under ? under.left + (under.width - w) / 2 : bar.right - w - 12;
  quick.style.top = (bar.bottom + 8) + 'px';
  quick.style.left = Math.max(8, Math.min(left, window.innerWidth - w - 8)) + 'px';
}

// --- a note's proposed fixes --------------------------------------------
// Whoever answered a delivered round may have proposed fixes for its notes:
// exact text in the source and what replaces it. They are offered here, in the
// note, where it is being read, and one tap puts one in. The same fixes, all
// of them at once, are at /paper/<id>/feedback.
function answersOf(note) {
  const all = (META && META.feedback) || {};
  return (note && note.id && all[note.id]) || {fixes: [], thread: []};
}

function waitingFixes(note) {
  if (!note || note.claude || note.status === 'done' || note.status === 'rejected') return [];
  return answersOf(note).fixes.filter(f => f.state === 'proposed');
}

function fxMake(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

// word by word, each stretch of change shown whole: what goes, then what comes
function fxDiff(old, neu) {
  const split = t => t.split(/(\s+)/).filter(x => x.length);
  const a = split(old), b = split(neu), box = fxMake('div', 'fx-diff');
  if (a.length * b.length > 250000) {
    box.append(fxMake('del', '', old), document.createTextNode(' '), fxMake('ins', '', neu));
    return box;
  }
  const n = a.length, m = b.length;
  const L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
    L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  }
  const parts = [];
  const add = (key, t) => {
    const last = parts[parts.length - 1];
    if (key === 'same') { if (last && 'same' in last) last.same += t; else parts.push({same: t}); }
    else if (last && !('same' in last)) last[key] += t;
    else parts.push(key === 'del' ? {del: t, ins: ''} : {del: '', ins: t});
  };
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { add('same', a[i]); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { add('ins', b[j]); j++; }
    else { add('del', a[i]); i++; }
  }
  const slight = t => !t.trim() || (t.trim().split(/\s+/).length === 1 && t.trim().length <= 3);
  for (let changed = true; changed;) {
    changed = false;
    for (let k = 1; k + 1 < parts.length; k++) {
      const p = parts[k - 1], q = parts[k], r = parts[k + 1];
      if ('same' in q && !('same' in p) && !('same' in r) && slight(q.same)) {
        parts.splice(k - 1, 3, {del: p.del + q.same + r.del, ins: p.ins + q.same + r.ins});
        changed = true;
        break;
      }
    }
  }
  for (const part of parts) {
    if ('same' in part) { box.append(document.createTextNode(part.same)); continue; }
    const edge = part.del || part.ins;
    const lead = edge.match(/^\s*/)[0], trail = edge.match(/\s*$/)[0];
    const gone = part.del.trim(), come = part.ins.trim();
    if (lead) box.append(document.createTextNode(lead));
    if (gone) box.append(fxMake('del', '', gone));
    if (gone && come) box.append(document.createTextNode(' '));
    if (come) box.append(fxMake('ins', '', come));
    if (trail) box.append(document.createTextNode(trail));
  }
  return box;
}

function showFixes(note) {
  const box = document.getElementById('sheet-fixes');
  box.innerHTML = '';
  const said = answersOf(note);
  const open = !(note.status === 'done' || note.status === 'rejected');
  // a note of the agent's own is there to be decided, with a fix or without
  const proposal = isAgent(note.by);
  box.hidden = !(said.fixes.length || said.thread.length || (proposal && open));
  if (box.hidden) return;
  const waiting = said.fixes.filter(f => f.state === 'proposed').length;
  box.append(fxMake('div', 'fx-head', proposal && open
    ? (waiting ? note.by + ' proposes this: approve or reject' : note.by + ' remarks this, with no fix')
    : waiting && open
    ? (waiting === 1 ? 'A fix is proposed' : waiting + ' fixes are proposed: choose one')
    : 'What came back'));
  for (const fix of said.fixes) {
    const card = fxMake('div', 'fx-card ' + fix.state);
    const top = fxMake('div', 'fx-top');
    const what = fxMake('div', 'fx-what', fix.summary);
    what.append(fxMake('span', 'fx-by', fix.by));
    top.append(what);
    if (fix.state === 'proposed' && open) {
      const use = fxMake('button', 'fx-use', proposal ? 'Approve' : 'Use this');
      use.type = 'button';
      use.onclick = () => useFix(note, fix, use);
      top.append(use);
    } else if (fix.state === 'applied') {
      top.append(fxMake('span', 'fx-badge', 'applied'));
      const back = fxMake('button', 'fx-undo', 'Undo');
      back.type = 'button';
      back.title = 'take this fix back out of the source; the note opens again';
      back.onclick = () => undoFix(note, fix, back);
      top.append(back);
    } else if (fix.state === 'failed') {
      top.append(fxMake('span', 'fx-badge failed', 'did not apply'));
    } else if (fix.state === 'rejected') {
      top.append(fxMake('span', 'fx-badge rejected', 'rejected'));
    }
    card.append(top);
    if (fix.why) card.append(fxMake('div', 'fx-why', fix.why));
    for (const e of fix.edits || []) {
      card.append(fxMake('div', 'fx-file', e.file), fxDiff(e.old, e.new));
    }
    if (fix.problem) card.append(fxMake('div', 'fx-problem', fix.problem));
    box.append(card);
  }
  for (const m of said.thread) {
    const msg = fxMake('div', 'fx-msg' + (m.by === 'you' ? ' you' : ''));
    msg.append(fxMake('span', 'fx-who', m.by), document.createTextNode(m.text));
    box.append(msg);
  }
  if (open) {
    const row = fxMake('div', 'fx-reply');
    const input = fxMake('input');
    input.placeholder = proposal ? 'Why not, if you reject it (optional)'
      : 'Reply: a further note, or which way to go';
    const send = fxMake('button', '', 'Reply');
    send.type = 'button';
    send.onclick = () => replyTo(note, input, send);
    row.append(input);
    if (proposal) {
      const no = fxMake('button', 'fx-reject', 'Reject');
      no.type = 'button';
      no.title = 'close it as rejected; what is typed beside it is kept as the reason';
      no.onclick = () => rejectProposal(note, input, no);
      row.append(no);
    } else {
      row.append(send);
    }
    box.append(row);
  }
}

function rejectProposal(note, input, button) {
  button.disabled = true;
  postJSON('/paper/' + PID + '/proposals/decide',
           {notes: [note.id], what: 'reject', why: input.value})
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'unknown error');
      const failed = Object.values(data.failed || {});
      if (failed.length) throw new Error(failed[0]);
      return load().then(() => {
        const next = nextWithFixes(note);
        if (next) { openNote(next); toast('Rejected. The next one:'); }
        else { closeSheet(); toast('Rejected.'); }
      });
    })
    .catch(err => { toast('Not rejected: ' + err.message, 6000); button.disabled = false; });
}

function useFix(note, fix, button) {
  button.disabled = true;
  postJSON('/paper/' + PID + '/feedback/apply', {note: note.id, fixes: [fix.id]})
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'unknown error');
      const failed = Object.values(data.failed || {});
      if (failed.length) throw new Error(failed[0]);
      const files = [...new Set((fix.edits || []).map(e => e.file))].join(', ');
      // straight on to the next note with a fix to choose, in the order they
      // sit on the pages, so a round of proposals is worked through without
      // hunting for the next ring on the page
      return load().then(() => {
        const next = nextWithFixes(note);
        if (next) {
          openNote(next);
          bringIntoView(next);
          toast('Put into ' + files + '. Next: ' + (next.source && next.source.file
            ? next.source.file + ':' + next.source.line : 'page ' + next.page), 3500);
        } else {
          closeSheet();
          toast('Put into ' + files + '. That was the last fix to choose. '
                + 'Rebuild to read the paper as it is now.', 6000);
        }
      });
    })
    .catch(err => { toast('Not applied: ' + err.message, 6000); button.disabled = false; load(); });
}

// the first note after this one, by page and position, with a fix waiting;
// from the top again if there is none further down
function nextWithFixes(after) {
  const list = notesInOrder().filter(n => n.id !== after.id && waitingFixes(n).length);
  const key = n => [n.page, (n.rect && n.rect[1]) || 0];
  const [p0, y0] = key(after);
  return list.find(n => { const [p, y] = key(n); return p > p0 || (p === p0 && y > y0); })
    || list[0] || null;
}

function replyTo(note, input, button) {
  if (!input.value.trim()) { input.focus(); return; }
  button.disabled = true;
  postJSON('/paper/' + PID + '/feedback/reply', {note: note.id, text: input.value})
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'unknown error');
      toast('Said. The note stays open for whoever answers next.');
      return load().then(() => {
        const again = allNotes().find(n => n.id === note.id);
        if (again && EDIT && EDIT.id === note.id) showFixes(again);
      });
    })
    .catch(err => toast('Not sent: ' + err.message, 6000))
    .finally(() => { button.disabled = false; });
}

function undoFix(note, fix, button) {
  button.disabled = true;
  postJSON('/paper/' + PID + '/feedback/undo', {note: note.id, fix: fix.id})
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'unknown error');
      toast('Taken back out; the note is open again.');
      return load().then(() => {
        const again = allNotes().find(n => n.id === note.id);
        if (again) openNote(again);
      });
    })
    .catch(err => { toast('Not undone: ' + err.message, 6000); button.disabled = false; });
}

// --- the agent, and what is waiting to be committed -------------------------
// What the agent is doing with the round, said in the header while it does it,
// and the review's commit one tap away: on the branch you are on, or on one
// of its own, to be taken or dropped.
let agentPoll = null;

function showAgentAndCommit() {
  const said = document.getElementById('agent-said');
  const ask = document.getElementById('ask-agent');
  const a = (META && META.agent) || {};
  const r = (META && META.review) || {};
  said.hidden = !a.state;
  said.className = 'agent-said ' + (a.state || '');
  const reviewing = a.mode === 'review';
  const who = a.runner || runnerName();
  if (reviewing && a.state === 'running') {
    said.textContent = who + ' is reviewing the paper…';
  } else if (reviewing && a.state === 'failed') {
    said.textContent = who + ' could not review: ' + (a.said || 'see its log');
  } else if (reviewing && a.state === 'done') {
    said.textContent = who + ' proposed ' + (a.notes || 0) + ' note' + (a.notes === 1 ? '' : 's');
  } else if (a.state === 'running') {
    said.textContent = who + ' is answering the round of ' + a.round + '…';
  } else if (a.state === 'failed') {
    said.textContent = who + ' could not answer: ' + (a.said || 'see its log');
  } else if (a.state === 'done') {
    said.textContent = who + ' answered the round of ' + a.round
      + (a.branch ? ', on ' + a.branch : '');
  } else if (a.state === 'stopped') {
    said.textContent = who + ' was stopped';
  }
  // someone to ask, and something to ask about: a sent note nobody has answered
  const answers = (META && META.feedback) || {};
  const unanswered = ((META && META.past) || []).some(n => !answered(n) && !answers[n.id]
                                                         && !isAgent(n.by));
  ask.hidden = !(a.mode && a.mode !== 'off' && a.mode !== 'review' && a.state !== 'running'
                 && unanswered);
  // a review needs a source to fix, and only one agent at a time
  const review = document.getElementById('ask-review');
  review.hidden = !META || /\.pdf$/i.test(META.main || '') || a.state === 'running';
  if (review.hidden) document.getElementById('review-focus').hidden = true;
  ask.textContent = 'Ask ' + runnerName() + (a.state && a.state !== 'running' ? ' again' : '');

  const n = r.to_commit || 0;
  document.getElementById('commit').hidden = !n || r.review_branch;
  document.getElementById('commit').textContent = 'Commit (' + n + ' note' + (n === 1 ? '' : 's') + ')';
  document.getElementById('commit-branch').hidden = !n || r.review_branch;
  document.getElementById('take').hidden = !r.review_branch;
  document.getElementById('drop').hidden = !r.review_branch;
  if (r.review_branch) {
    document.getElementById('take').textContent = 'Take ' + r.branch;
    if (n) {
      document.getElementById('commit').hidden = false;    // more fixes on the branch
    }
  }
  clearTimeout(agentPoll);
  if (a.state === 'running') agentPoll = setTimeout(load, 10000);
}

function headerCall(url, body, done, button) {
  button.disabled = true;
  postJSON(url, body)
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'unknown error');
      toast(done(data), 6000);
      return load();
    })
    .catch(err => toast(err.message, 6000))
    .finally(() => { button.disabled = false; });
}

function closeSheet() {
  document.getElementById('quick-save').hidden = true;
  document.getElementById('sheet').hidden = true;
  EDIT = null;
  SEL = null;
  drawAll();
}

// widen or narrow the selection by a sentence, keeping the note on it
function growSelection(by) {
  if (!SEL || SEL.kind !== 'sentence') return;
  const list = layoutOf(SEL.page).sentences;
  const next = SEL.to + by;
  if (next < Math.min(SEL.from, 0) || next >= list.length) return;
  if (next < SEL.from && by < 0 && SEL.to === SEL.from) return;  // never inside out
  SEL.to = Math.max(SEL.from, Math.min(next, list.length - 1));
  drawAll();
  refreshQuote();
}

// a word note that turns out to be about the whole sentence after all
function widenToSentence() {
  if (!SEL || SEL.kind !== 'word' || SEL.sentence < 0) return;
  SEL = {page: SEL.page, kind: 'sentence', from: SEL.sentence, to: SEL.sentence};
  drawAll();
  refreshQuote();
}

function saveNote() {
  if (!EDIT) return;
  const tagEl = document.querySelector('#sheet-tags .tag.on');
  const body = {
    page: EDIT.page,
    rect: EDIT.rect || [0, 0, 0, 0],
    rects: EDIT.rects || [],
    kind: EDIT.kind || 'region',
    tag: tagEl ? tagEl.dataset.tag : 'AUTO',
    note: document.getElementById('sheet-text').value.trim(),
    ink: EDIT.ink || [],
    // Sent back as they are. A save is a replacement, and a note saved from
    // this panel without them lost its handwriting to a change of tag.
    hand: EDIT.hand || [],
    pad: EDIT.pad || [],
  };
  if (EDIT.id) body.id = EDIT.id;
  if (!body.note && !body.ink.length && !body.hand.length) {
    toast('Write something, or keep some ink'); return;
  }
  document.getElementById('sheet-save').disabled = true;
  document.getElementById('quick-save').disabled = true;
  postJSON('/paper/' + PID + '/note', body)
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'unknown error');
      closeSheet(); clearInk(); load();
      toast('Saved to ' + (data.note.source && data.note.source.file
        ? data.note.source.file + ':' + data.note.source.line : 'page ' + data.note.page));
    })
    .catch(err => toast('Not saved: ' + err.message, 5000))
    .finally(() => {
      document.getElementById('sheet-save').disabled = false;
      document.getElementById('quick-save').disabled = false;
    });
}

// --- the writing pad --------------------------------------------------
// Writing on top of the sentence you are writing about is no good: the words
// disappear under the ink. So the pen writes in a pad put beside whatever was
// picked, joined to it by a leader, and dragged out of the way when the paper
// underneath matters more. Its strokes are kept in the pad's own coordinates,
// never the page's, so the handwriting reads back at the size it was written.
const pad = document.getElementById('pad');
const padCanvas = document.getElementById('pad-canvas');
let HAND = [];          // strokes in pad coordinates
let padStroke = null;
let PAD_TAG = 'AUTO';
let padTarget = null;   // the selection the pad is writing about
let PAD_EDIT = null;    // the note whose handwriting the pad holds, if it is one
let PAD_WAS = '';       // what that handwriting was, to tell a change from none
let PAD_UNDO = [];      // HAND before each stroke, rub-out and clear
let padRubbed = false;  // whether the rub-out under way has taken anything

function padSize() {
  const box = padCanvas.getBoundingClientRect();
  return [Math.round(box.width), Math.round(box.height)];
}

function drawPad() {
  const box = padCanvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  if (padCanvas.width !== Math.round(box.width * dpr)) {
    padCanvas.width = Math.round(box.width * dpr);
    padCanvas.height = Math.round(box.height * dpr);
  }
  const g = padCanvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, box.width, box.height);
  g.strokeStyle = 'rgba(217,48,37,.95)';
  g.lineWidth = 2.2; g.lineCap = 'round'; g.lineJoin = 'round';
  for (const st of HAND) {
    const pts = (st || []).filter(p => p && Number.isFinite(p[0]) && Number.isFinite(p[1]));
    if (!pts.length) continue;
    g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.stroke();
  }
  pad.classList.toggle('empty', !HAND.length);
}

// Put the pad where it does not cover what it is about: under the selection
// if there is room on screen, over it if not, and never across it.
function placePad() {
  const rects = selectionRects();
  const page = document.querySelector('.page[data-page="' + (padTarget && padTarget.page) + '"]');
  if (!page || !rects.length) return;
  const host = document.getElementById('pages');
  const box = page.getBoundingClientRect();
  const k = box.width / META.build.sizes[padTarget.page - 1][0];
  const top = Math.min(...rects.map(r => r[1])) * k + box.top;
  const bottom = Math.max(...rects.map(r => r[3])) * k + box.top;
  const left = Math.min(...rects.map(r => r[0])) * k + box.left;
  const gap = 14;
  const ceiling = host.getBoundingClientRect().top + 4;
  const floor = window.innerHeight - 8;
  // the writing area gives way before the buttons do: a pad whose Keep is off
  // the bottom of the screen cannot be used at all
  const chrome = pad.offsetHeight - padCanvas.getBoundingClientRect().height;
  const roomBelow = floor - (bottom + gap), roomAbove = (top - gap) - ceiling;
  const best = Math.max(roomBelow, roomAbove);
  let canvasH = Math.max(90, Math.min(padCanvas.getBoundingClientRect().height,
                                      best - chrome));
  padCanvas.style.height = canvasH + 'px';
  const h = canvasH + chrome, w = pad.offsetWidth || 380;
  let y = (roomBelow >= h) ? bottom + gap
        : (roomAbove >= h) ? top - gap - h
        : Math.max(ceiling, floor - h);
  const x = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  pad.style.left = (x + window.scrollX) + 'px';
  pad.style.top = (Math.max(ceiling, Math.min(y, floor - h)) + window.scrollY) + 'px';
}

function openPad() {
  if (!SEL) return;
  padTarget = SEL;
  HAND = [];
  PAD_UNDO = [];
  PAD_TAG = 'AUTO';
  document.getElementById('pad-tag').value = PAD_TAG;
  const what = SEL.kind === 'figure' ? SEL.label
    : SEL.kind === 'word' ? 'the word "' + SEL.text + '"'
    : selectionText();
  document.getElementById('pad-about').textContent = 'about: ' + what;
  document.getElementById('pad-about').title = what;
  pad.hidden = false;
  setPenMode(PEN_MODE);
  placePad();
  drawPad();
  drawAll();
}

function closePad() {
  pad.hidden = true;
  padTarget = null;
  PAD_EDIT = null;
  PAD_WAS = '';
  PAD_UNDO = [];
  HAND = [];
  drawAll();
}

let padErasing = false;
const MIN_STEP = 1.1;   // px between kept points

// A pen reports at the screen's rate, which for a page of handwriting is tens
// of thousands of points, most of them a fraction of a pixel apart. Dropping
// those changes nothing anyone can see and keeps a note a sane size to store
// and to send.
function addPoint(stroke, x, y) {
  const last = stroke[stroke.length - 1];
  if (last && Math.abs(x - last[0]) < MIN_STEP && Math.abs(y - last[1]) < MIN_STEP) {
    return false;
  }
  stroke.push([Math.round(x * 10) / 10, Math.round(y * 10) / 10]);
  return true;
}

padCanvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;   // a finger is for moving, not writing
  e.preventDefault();
  const box = padCanvas.getBoundingClientRect();
  if (!box.width || !Number.isFinite(e.clientX)) return;
  // capture last, and never let it stop the stroke: it throws on a pointer id
  // the browser no longer considers active, and losing the whole gesture to
  // that is worse than losing the capture
  const grab = () => {
    try { padCanvas.setPointerCapture(e.pointerId); } catch (err) {}
  };
  penContacts += 1;
  if (isEraser(e)) {
    // One rub-out is one step to undo, however much it takes on the way:
    // remembered as it starts, and forgotten again if it took nothing. A pen
    // can report a move with its button down just before the down itself, and
    // that move has already started this one.
    if (!padErasing) {
      remember(PAD_UNDO, HAND);
      padRubbed = false;
    }
    padErasing = true;
    padStroke = null;
    const [kept, changed] = rubOut(HAND, e.clientX - box.left, e.clientY - box.top, ERASER_R);
    HAND = kept;
    padRubbed = padRubbed || changed;
    drawPad();
    grab();
    return;
  }
  padErasing = false;
  remember(PAD_UNDO, HAND);
  padStroke = [[e.clientX - box.left, e.clientY - box.top]];
  HAND.push(padStroke);
  drawPad();
  grab();
});
padCanvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  const box = padCanvas.getBoundingClientRect();
  if (padErasing || (isEraser(e) && e.buttons)) {
    e.preventDefault();
    if (!padErasing) {              // the button pressed in the middle of a stroke
      padErasing = true;
      padStroke = null;
      padRubbed = false;
      remember(PAD_UNDO, HAND);
    }
    const [kept, changed] = rubOut(HAND, e.clientX - box.left, e.clientY - box.top, ERASER_R);
    if (changed) { HAND = kept; padRubbed = true; drawPad(); }
    return;
  }
  if (!padStroke) return;
  e.preventDefault();
  if (addPoint(padStroke, e.clientX - box.left, e.clientY - box.top)) drawPad();
});
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
  padCanvas.addEventListener(ev, () => {
    if (padErasing && !padRubbed) PAD_UNDO.pop();    // it rubbed out nothing
    padStroke = null; padErasing = false; padRubbed = false;
  });
}

// resized from the corner, both wider and taller: a long note needs room and
// a short one should not cover the page
{
  const grip = document.getElementById('pad-resize');
  let from = null;
  grip.addEventListener('pointerdown', (e) => {
    from = {x: e.clientX, y: e.clientY,
            w: pad.offsetWidth, h: padCanvas.getBoundingClientRect().height};
    grip.setPointerCapture(e.pointerId);
    e.preventDefault();
    e.stopPropagation();
  });
  grip.addEventListener('pointermove', (e) => {
    if (!from) return;
    pad.style.width = Math.max(240, from.w + e.clientX - from.x) + 'px';
    padCanvas.style.height = Math.max(110, from.h + e.clientY - from.y) + 'px';
    drawPad();
    drawAll();
  });
  for (const ev of ['pointerup', 'pointercancel']) {
    grip.addEventListener(ev, () => { from = null; });
  }
}

// dragged by its head, the way the board's file window is
{
  const head = document.getElementById('pad-head');
  let from = null;
  head.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.pad-x')) return;
    from = {x: e.clientX, y: e.clientY, left: pad.offsetLeft, top: pad.offsetTop};
    head.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  head.addEventListener('pointermove', (e) => {
    if (!from) return;
    pad.style.left = Math.max(4, from.left + e.clientX - from.x) + 'px';
    pad.style.top = Math.max(4, from.top + e.clientY - from.y) + 'px';
    drawAll();      // the leader follows it
  });
  for (const ev of ['pointerup', 'pointercancel']) {
    head.addEventListener(ev, () => { from = null; });
  }
}

// Tapping away closes the pad, and asks first when something has been written
// and not kept. Cancel leaves the pad exactly as it was: nothing written is
// ever thrown away by a stray tap, only by the × or by clear.
function padGuard() {
  if (pad.hidden) return true;
  const unchanged = PAD_EDIT && JSON.stringify(HAND) === PAD_WAS;
  if ((!HAND.length && !PAD_EDIT) || unchanged) { closePad(); return true; }
  // Said in one line on purpose: this template is a python string, and a
  // newline escape written here is consumed before the browser sees it.
  if (confirm('Something is written and not kept yet. '
              + 'OK keeps it as a note, Cancel goes back to the pad.')) {
    savePad();
    return true;
  }
  return false;
}

// Two taps, not one. A single tap is too easy to make by accident with a hand
// on the glass, and it was closing windows nobody meant to close. Two taps on
// the text open a note there; two taps on anything else close what is open.
const DOUBLE_MS = 380;
const HOLD_MS = 500;    // a press this long means the same as tapping twice
let lastTap = null;
let tapFrom = null;
let holdTimer = null;
let heldFired = false;

function cancelHold() {
  clearTimeout(holdTimer);
  holdTimer = null;
}

// One tap on the text does nothing, and to anybody who has not been told that
// reads as the reader not working. So once it is clear no second tap is
// coming, it says what does. Not more often than every few seconds: a tap
// while reading is often only a hand finding its place.
const HINT_EVERY = 4000;
let hintTimer = null, lastHintAt = 0;

function cancelTapHint() {
  clearTimeout(hintTimer);
  hintTimer = null;
}

// whether a point is on something a note can be put on, without picking it
function onText(target, clientX, clientY) {
  const page = target && target.closest ? target.closest('.page') : null;
  if (!page || target.closest('.pin')) return false;
  const n = Number(page.dataset.page);
  const [x, y] = toPdf(page, clientX, clientY);
  return !!(sentenceAt(n, x, y) || wordAt(n, x, y) || figureAt(n, x, y));
}

function hintAfterTap(target, clientX, clientY) {
  cancelTapHint();
  if (!pad.hidden || !document.getElementById('sheet').hidden) return;
  if (!onText(target, clientX, clientY)) return;
  hintTimer = setTimeout(() => {
    hintTimer = null;
    if (Date.now() - lastHintAt < HINT_EVERY) return;
    lastHintAt = Date.now();
    toast(TOOL === 'pen' ? 'Tap twice or hold on a sentence to write about it'
                         : 'Tap twice or hold to put a note on this', 1600);
  }, DOUBLE_MS + 40);
}

document.addEventListener('pointerdown', (e) => {
  tapFrom = null;
  heldFired = false;
  cancelHold();
  cancelTapHint();          // a second tap is on its way, or something else is
  if (e.target.closest('#pad, #sheet, #quick-save, #searchbar, #occur, .tools, header')) return;
  if (e.pointerType === 'pen' || isPalm(e)) return;
  tapFrom = {x: e.clientX, y: e.clientY, at: Date.now(), target: e.target};
  // Holding still is the same as tapping twice. Two taps are quick when you
  // know the trick and invisible when you do not; a press is what a hand
  // reaches for on its own.
  holdTimer = setTimeout(() => {
    if (!tapFrom) return;
    heldFired = true;
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
    pickHere(tapFrom.target, tapFrom.x, tapFrom.y);
  }, HOLD_MS);
}, true);

document.addEventListener('pointermove', (e) => {
  if (!tapFrom) return;
  if (Math.abs(e.clientX - tapFrom.x) + Math.abs(e.clientY - tapFrom.y) > TAP_SLOP) {
    cancelHold();          // it turned into a scroll
    tapFrom = null;
  }
}, true);

for (const ev of ['pointerup', 'pointercancel']) {
  document.addEventListener(ev, (e) => {
    const from = tapFrom;
    tapFrom = null;
    cancelHold();
    if (heldFired) { heldFired = false; lastTap = null; return; }
    if (!from || ev === 'pointercancel') return;
    const still = Math.abs(e.clientX - from.x) + Math.abs(e.clientY - from.y) < TAP_SLOP;
    if (!still || Date.now() - from.at > 700) return;   // a drag
    const near = lastTap
      && Date.now() - lastTap.at < DOUBLE_MS
      && Math.abs(e.clientX - lastTap.x) + Math.abs(e.clientY - lastTap.y) < 34;
    lastTap = {x: e.clientX, y: e.clientY, at: Date.now()};
    if (!near) { hintAfterTap(e.target, e.clientX, e.clientY); return; }
    lastTap = null;
    pickHere(e.target, e.clientX, e.clientY);
  }, true);
}

// the browser's own long press would put a selection or a context menu on top
// of ours, and there is nothing on these pages for either of them to act on
for (const ev of ['contextmenu']) {
  document.addEventListener(ev, (e) => {
    if (e.target.closest('.page')) e.preventDefault();
  });
}

// Two taps on a sentence, a word or a figure put a note there, and so does
// holding a finger on it; either gesture anywhere else closes whatever window
// is open.
function pickHere(target, clientX, clientY) {
  const page = target && target.closest ? target.closest('.page') : null;
  const onPin = target && target.closest && target.closest('.pin');
  if (page && !onPin) {
    const el = page;
    const n = Number(el.dataset.page);
    const picked = pickUnderFinger(el, clientX, clientY);
    if (picked) {
      if (!pad.hidden && !padGuard()) return;     // never lose what is written
      if (TOOL === 'pen') { openPad(); }
      else {
        openNote({page: n, kind: SEL.kind, rects: selectionRects(),
                  anchor: selectionText(), label: SEL.label, tag: 'AUTO'});
      }
      return;
    }
  }
  if (!pad.hidden) padGuard();
  else if (!document.getElementById('sheet').hidden) sheetGuard();
}

document.getElementById('pad-close').onclick = () => {
  if (PAD_EDIT) {
    if (JSON.stringify(HAND) === PAD_WAS
        || confirm('Throw these changes away? The note stays as it was.')) closePad();
    return;
  }
  if (!HAND.length || confirm('Discard what you have written?')) closePad();
};
document.getElementById('pad-undo').onclick = () => {
  if (!PAD_UNDO.length) { toast('Nothing to undo'); return; }
  HAND = PAD_UNDO.pop();
  drawPad();
};
document.getElementById('pad-clear').onclick = () => {
  if (!HAND.length || confirm('Throw this note away?')) {
    remember(PAD_UNDO, HAND);       // and undo brings it back
    HAND = [];
    drawPad();
  }
};
document.getElementById('pad-tag').addEventListener('change', (e) => {
  PAD_TAG = e.target.value;
});

function savePad() {
  const was = PAD_EDIT;
  // a note that still has words or ink may lose all of its handwriting
  const keepsSomething = was && (was.note || (was.ink && was.ink.length));
  if (!HAND.length && !keepsSomething) { toast('Nothing written yet'); return; }
  if (!padTarget) { toast('Nothing to attach it to'); return; }
  const btn = document.getElementById('pad-save');
  btn.disabled = true;
  // Changing a note replaces it where it stands: its id, what it is about,
  // its words and its ink go back unchanged with the new handwriting.
  const body = was ? {
    id: was.id, page: was.page, kind: was.kind || 'region',
    rect: was.rect || [0, 0, 0, 0], rects: was.rects || [],
    tag: PAD_TAG, note: was.note || '', ink: was.ink || [],
    hand: HAND, pad: padSize(),
  } : {
    page: padTarget.page,
    kind: padTarget.kind,
    rect: [0, 0, 0, 0],
    rects: selectionRects(),
    tag: PAD_TAG,
    hand: HAND,
    pad: padSize(),
    ink: PENDING.length && strokePage === padTarget.page ? PENDING : [],
  };
  postJSON('/paper/' + PID + '/note', body)
    .then(data => {
      if (!data.ok) throw new Error(data.error || 'unknown error');
      closePad(); if (!was) clearInk(); SEL = null; load();
      toast((was ? 'Changed, on ' : 'Kept, on ') + (data.note.source && data.note.source.file
        ? data.note.source.file + ':' + data.note.source.line : 'page ' + data.note.page));
    })
    .catch(err => toast('Not kept: ' + err.message, 5000))
    .finally(() => { btn.disabled = false; });
}

document.getElementById('pad-save').onclick = savePad;

window.addEventListener('resize', () => { if (!pad.hidden) { placePad(); drawPad(); } });
