<!doctype html>
<meta charset="utf-8">
<title>{name}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg">
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef1f5; --paper: #ffffff; --ink: #172b4d; --muted: #5e6c84;
    --bar: #dfe3ea; --accent: #0079bf;
    --science: #d9822b; --language: #0079bf; --question: #6554c0; --todo: #5e6c84;
    --pen: #d93025; --claude: #00a3bf;
    --noted: #e8a33d;   /* a sentence that already carries a note */
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --paper: #262c38; --ink: #e6e9ef; --muted: #9aa3b2; --bar: #1c212b; }
  }
  * { box-sizing: border-box; }
  /* Scrolling is the browser's, pinching is not: a pinch zooms the paper,
     which the page does itself (see pinchZoom), and never the whole page with
     its bars. pan-x pan-y is the browser's pinch taken away everywhere, the
     tool bar included, since a touch-action narrows down the tree. */
  html, body { margin: 0; height: 100%; touch-action: pan-x pan-y; }
  body {
    background: var(--bg); color: var(--ink); overscroll-behavior: none;
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: .6rem; padding: .5rem .7rem;
    background: var(--bar); flex: 0 0 auto; flex-wrap: wrap;
  }
  header a.back { color: var(--muted); text-decoration: none; font-size: 1.1rem; }
  header a.chip {
    border: 1px solid #8883; background: var(--paper); color: var(--ink);
    border-radius: 7px; padding: .35rem .7rem; font-size: .78rem; text-decoration: none;
  }
  h1 { font-size: .95rem; margin: 0; font-weight: 600; }
  .state { font-size: .68rem; color: var(--muted); }
  .state b { color: var(--ink); font-family: ui-monospace, monospace; font-weight: 600; }
  .stale { color: var(--science); }
  .grow { flex: 1 1 auto; }
  header button, .tool, .tag {
    border: 1px solid #8883; background: var(--paper); color: var(--ink);
    border-radius: 7px; padding: .35rem .7rem; font: inherit; font-size: .78rem;
    cursor: pointer; touch-action: manipulation;
  }
  header button.go { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  header button[disabled] { opacity: .5; }

  /* search: the matches drawn where they are, and listed, emacs's occur */
  #searchbar { display: flex; gap: .4rem; align-items: center; padding: .4rem .7rem;
               background: var(--bar); border-top: 1px solid #8882; flex: 0 0 auto; }
  #searchbar[hidden] { display: none; }
  #searchbar input { flex: 1 1 auto; min-width: 0; font: inherit; font-size: .9rem;
                     border: 1px solid #8884; border-radius: 8px; padding: .4rem .6rem;
                     background: var(--paper); color: var(--ink); }
  #searchbar .count { font-size: .74rem; color: var(--muted); white-space: nowrap; }
  #searchbar button { border: 1px solid #8883; background: var(--paper); color: var(--ink);
                      border-radius: 7px; padding: .35rem .7rem; font: inherit; font-size: .78rem;
                      cursor: pointer; }
  #searchbar button.on { background: var(--accent); color: #fff; border-color: transparent; }
  .hitband { position: absolute; pointer-events: none; border-radius: 2px;
             background: #ffd54f66; box-shadow: inset 0 -2px 0 #f0a500; }
  .hitband.now { background: #ffb30099; box-shadow: 0 0 0 2px #f0a500; }
  #occur { position: fixed; z-index: 28; right: .6rem; top: 7.5rem; bottom: .6rem;
           width: min(26rem, 92vw); overflow: auto; background: var(--paper);
           border: 1px solid #8884; border-radius: 10px; box-shadow: 0 6px 24px rgba(9,30,66,.3); }
  #occur[hidden] { display: none; }
  #occur .row { display: flex; gap: .5rem; padding: .45rem .65rem; font-size: .8rem;
                line-height: 1.4; border-bottom: 1px solid #8882; cursor: pointer; }
  #occur .row:hover, #occur .row.now { background: color-mix(in srgb, var(--accent) 10%, var(--paper)); }
  #occur .pg { flex: 0 0 auto; color: var(--muted); font-size: .68rem; min-width: 2.2rem;
               font-variant-numeric: tabular-nums; }
  #occur mark { background: #ffd54f; color: inherit; border-radius: 2px; }
  #occur .more { padding: .5rem .65rem; font-size: .72rem; color: var(--muted); }
  .tools {
    display: flex; align-items: center; gap: .35rem; padding: .4rem .7rem;
    background: var(--bar); flex: 0 0 auto; overflow-x: auto; border-top: 1px solid #8882;
  }
  .tool.on { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  /* an icon, and a word beside it where there is one. A button keeps its
     width and its one line: the bar scrolls sideways before a button is
     squeezed into a stack of single words. */
  .tools .tool { flex: 0 0 auto; white-space: nowrap; }
  .tool svg { vertical-align: -3px; }
  .tool svg + span { margin-left: .3rem; }
  .tools .sep { width: 1px; height: 1.4rem; background: #8883; flex: 0 0 auto; }
  /* what a tap picks out, offered only while it means something */
  .grain { display: flex; gap: .25rem; }
  .grain[hidden] { display: none; }
  .hint { font-size: .68rem; color: var(--muted); white-space: nowrap; }

  #pages { flex: 1 1 auto; overflow: auto; padding: .7rem 0 4rem; -webkit-overflow-scrolling: touch; }
  .page {
    position: relative; margin: 0 auto .8rem; background: var(--paper);
    box-shadow: 0 1px 6px rgba(9,30,66,.25); width: var(--w);
  }
  .page img { display: block; width: 100%; height: auto; }
  /* the page is a picture, and a long press on it is ours: not Safari's Save
     Image callout, nor its magnifier, nor a drag of the image */
  #pages, .page, .page img, .page canvas {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .page canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* the pen needs the surface to itself; in every other mode the finger
     scrolls and pinches the page as it would any other document */
  body:not(.pen) .page canvas { pointer-events: none; }
  /* In pen mode the page still scrolls the way the platform scrolls it,
     with momentum and pinch, because taking the surface away from the browser
     is what kills inertia. It is taken away only while the pen is actually
     near: the S Pen reports hover, so by the time the tip lands the surface is
     already the pen's. */
  body.pen .page canvas { touch-action: pan-x pan-y; }
  body.pen.pen-near .page canvas { touch-action: none; }
  .pageno {
    position: absolute; bottom: -1.1rem; right: .2rem; font-size: .6rem; color: var(--muted);
  }
  .pin {
    position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--paper);
    background: var(--todo); color: #fff; font-size: .62rem; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%);
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .pin.SCIENCE { background: var(--science); } .pin.LANGUAGE { background: var(--language); }
  .pin.QUESTION { background: var(--question); }
  .pin.claude { background: var(--claude); }
  .pin.done { background: var(--paper); color: var(--muted); border-color: var(--muted); }
  /* A sentence that carries a note stays marked, in its own colour: the blue
     wash is what is selected right now, and the two must not look alike. */
  .band {
    position: absolute; border-radius: 2px; pointer-events: none;
    background: color-mix(in srgb, var(--noted) 26%, transparent);
    box-shadow: inset 0 -1.5px 0 color-mix(in srgb, var(--noted) 75%, transparent);
  }
  .band.done {
    background: color-mix(in srgb, var(--muted) 14%, transparent);
    box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--muted) 45%, transparent);
  }
  .band.claude {
    background: color-mix(in srgb, var(--claude) 20%, transparent);
    box-shadow: inset 0 -1.5px 0 color-mix(in srgb, var(--claude) 70%, transparent);
  }

  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--paper);
    border-radius: 14px 14px 0 0; box-shadow: 0 -2px 20px rgba(9,30,66,.35);
    padding: .8rem .9rem calc(.9rem + env(safe-area-inset-bottom)); max-height: 82vh; overflow: auto;
  }
  #sheet[hidden] { display: none; }
  /* a note's proposed fixes, in the note itself: one tap puts one in */
  .sheet-fixes { margin: 0 0 .6rem; display: flex; flex-direction: column; gap: .45rem; }
  .sheet-fixes[hidden] { display: none; }
  .sheet-fixes .fx-head { font-size: .68rem; color: var(--muted); text-transform: uppercase;
                          letter-spacing: .06em; }
  .fx-card { border: 1px solid #8884; border-radius: 9px; padding: .55rem .65rem;
             background: var(--bg); }
  .fx-card.applied { border-color: #1f7a4d; }
  .fx-card.failed { border-color: var(--pen); }
  .fx-top { display: flex; align-items: flex-start; gap: .5rem; }
  .fx-what { flex: 1 1 auto; min-width: 0; font-weight: 600; font-size: .85rem; }
  .fx-by { font-weight: 400; font-size: .65rem; color: var(--muted); margin-left: .3rem; }
  .fx-why { font-size: .74rem; color: var(--muted); margin: .15rem 0 .3rem; }
  .fx-file { font-family: ui-monospace, monospace; font-size: .62rem; color: var(--muted);
             margin-top: .25rem; }
  .fx-diff { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .78rem;
             line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
             background: var(--paper); border-radius: 6px; padding: .35rem .5rem; }
  .fx-diff del { color: #c0392b; background: #c0392b1a; text-decoration: line-through; }
  .fx-diff ins { color: #1f7a4d; background: #1f7a4d1f; text-decoration: none; }
  .fx-use { flex: 0 0 auto; border: 0; border-radius: 8px; padding: .5rem .95rem;
            background: var(--accent); color: #fff; font: inherit; font-size: .82rem;
            font-weight: 600; cursor: pointer; touch-action: manipulation; }
  .fx-use[disabled] { opacity: .5; }
  .fx-badge { flex: 0 0 auto; font-size: .66rem; font-weight: 700; color: #fff;
              border-radius: 4px; padding: .1rem .4rem; background: #1f7a4d; }
  .fx-badge.failed { background: var(--pen); }
  .fx-undo { flex: 0 0 auto; border: 1px solid #8884; border-radius: 8px; padding: .35rem .75rem;
             background: var(--paper); color: var(--ink); font: inherit; font-size: .78rem;
             cursor: pointer; touch-action: manipulation; }
  /* the agent, and what is waiting to be committed, in the header */
  .agent-said { font-size: .74rem; color: var(--muted); }
  .agent-said.running { color: var(--accent); font-weight: 600; }
  .agent-said.failed { color: var(--pen); }
  .agent-said a { color: inherit; }
  .fx-problem { font-size: .72rem; color: var(--pen); margin-top: .25rem; }
  .fx-msg { font-size: .8rem; line-height: 1.4; padding: .4rem .6rem; border-radius: 9px;
            background: var(--bg); max-width: 92%; }
  .fx-msg.you { align-self: flex-end; background: color-mix(in srgb, var(--accent) 14%, var(--paper)); }
  .fx-msg .fx-who { display: block; font-size: .6rem; color: var(--muted); }
  .fx-reply { display: flex; gap: .4rem; }
  .fx-reply input { flex: 1 1 auto; min-width: 0; font: inherit; font-size: .82rem;
                    border: 1px solid #8884; border-radius: 8px; padding: .4rem .55rem;
                    background: var(--bg); color: var(--ink); }
  .fx-reply button { border: 1px solid #8883; border-radius: 8px; background: var(--bg);
                     color: var(--ink); font: inherit; font-size: .8rem; padding: .4rem .8rem;
                     cursor: pointer; }
  /* a pin whose note has a fix waiting to be chosen */
  .pin.has-fix { box-shadow: 0 0 0 3px var(--accent), 0 1px 3px rgba(0,0,0,.4); }
  /* a note Claude wrote itself, to approve or reject: Claude's colour, square */
  .pin.proposal { background: var(--claude); border-radius: 5px; }
  .pin.proposal.done { background: var(--paper); }
  .fx-card.rejected { opacity: .6; }
  .fx-badge.rejected { background: var(--muted); }
  .fx-reply button.fx-reject { color: var(--pen); border-color: color-mix(in srgb, var(--pen) 45%, transparent); }
  #review-focus { font: inherit; font-size: .78rem; border: 1px solid #8884; border-radius: 8px;
                  padding: .35rem .55rem; background: var(--bg); color: var(--ink);
                  min-width: 0; width: 15rem; max-width: 40vw; }
  #review-focus[hidden] { display: none; }
  /* the panel's Save, again, where the hand already is: under the tool bar */
  #quick-save {
    position: fixed; z-index: 31; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-size: .85rem;
    font-weight: 600; padding: .5rem 1.1rem; cursor: pointer; touch-action: manipulation;
    box-shadow: 0 3px 12px rgba(9,30,66,.35);
  }
  #quick-save[hidden] { display: none; }
  #quick-save[disabled] { opacity: .5; }
  .sheet-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
  .sheet-head .where { font-size: .7rem; color: var(--muted); font-family: ui-monospace, monospace; }
  /* stepping through the notes on a paper, in the order they sit on the pages */
  .sheet-nav { display: flex; align-items: center; gap: .15rem; flex: 0 0 auto; }
  .sheet-nav[hidden] { display: none; }
  .sheet-nav button {
    border: 1px solid #8883; background: var(--bg); color: var(--ink);
    border-radius: 7px; min-width: 32px; min-height: 30px; font-size: 1rem;
    cursor: pointer; line-height: 1;
  }
  .sheet-nav button[disabled] { opacity: .35; }
  .sheet-count {
    font-size: .7rem; color: var(--muted); min-width: 3.2rem; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .quote {
    font-size: .78rem; color: var(--muted); border-left: 3px solid #8884;
    padding: .2rem .6rem; margin: 0 0 .6rem; max-height: 6.5rem; overflow: auto;
  }
  /* your own handwriting, read back at the size you wrote it */
  #sheet-hand {
    display: block; width: 100%; height: 150px; margin: 0 0 .6rem;
    background: var(--bg); border: 1px solid #8883; border-radius: 8px;
  }
  #sheet-hand[hidden] { display: none; }
  /* going back into a note's own handwriting, or its ink on the page */
  .sheet-redo { display: flex; gap: .35rem; align-items: center; flex-wrap: wrap;
                margin: -.2rem 0 .6rem; }
  .sheet-redo[hidden] { display: none; }
  .sheet-redo button {
    border: 1px solid #8883; background: var(--bg); color: var(--ink);
    border-radius: 6px; padding: .3rem .7rem; font: inherit; font-size: .75rem; cursor: pointer;
  }
  .sheet-redo button[hidden] { display: none; }
  .sheet-redo .said { font-size: .7rem; color: var(--muted); }
  .grow-sel { display: flex; gap: .35rem; align-items: center; margin: -.3rem 0 .6rem; }
  .grow-sel[hidden] { display: none; }
  .grow-sel button {
    border: 1px solid #8883; background: var(--bg); color: var(--muted);
    border-radius: 6px; padding: .2rem .6rem; font: inherit; font-size: .72rem; cursor: pointer;
  }
  .grow-sel button:hover { color: var(--ink); }
  .grow-n { font-size: .7rem; color: var(--muted); }
  .tags { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: .5rem; }
  .tag.on { color: #fff; border-color: transparent; font-weight: 600; }
  .tag.on[data-tag=SCIENCE] { background: var(--science); }
  .tag.on[data-tag=LANGUAGE] { background: var(--language); }
  .tag.on[data-tag=QUESTION] { background: var(--question); }
  .tag.on[data-tag=TODO] { background: var(--todo); }
  .tag.on[data-tag=AUTO] { background: var(--muted); }
  .pad-foot .tag.on[data-tag=AUTO] { background: var(--muted); }
  #sheet textarea {
    width: 100%; min-height: 5.5rem; border: 1px solid #8883; border-radius: 8px;
    padding: .5rem .6rem; font: inherit; font-size: .9rem; background: var(--bg); color: var(--ink);
  }
  .sheet-foot { display: flex; gap: .4rem; align-items: center; margin-top: .6rem; }
  .sheet-foot .grow { flex: 1 1 auto; }
  .sheet-foot button { border: 1px solid #8883; background: var(--bg); color: var(--ink);
    border-radius: 8px; padding: .45rem .9rem; font: inherit; font-size: .85rem; cursor: pointer; }
  .sheet-foot .save { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  .sheet-foot .del { color: var(--pen); }
  .inkmark { font-size: .7rem; color: var(--pen); }
  /* The writing pad: a place to write about a sentence that does not sit on
     top of it. Put beside whatever was picked, joined to it by a leader, and
     moved by its handle when the paper underneath matters more. */
  #pad {
    position: absolute; z-index: 25; width: min(420px, 82vw);
    background: var(--paper); border-radius: 10px; border: 1px solid #8884;
    box-shadow: 0 6px 24px rgba(9,30,66,.30); touch-action: none;
  }
  #pad[hidden] { display: none; }
  .pad-head {
    display: flex; align-items: center; gap: .4rem; padding: .35rem .5rem;
    background: var(--bar); border-radius: 9px 9px 0 0; cursor: grab;
  }
  .pad-head:active { cursor: grabbing; }
  .pad-about {
    flex: 1 1 auto; min-width: 0; font-size: .7rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pad-grip { color: var(--muted); font-size: .8rem; letter-spacing: -2px; }
  /* what the pen is telling the browser, live: the only way to find out what a
     given stylus sends for its side button is to look while it is pressed */
  .pad-pen {
    font-family: ui-monospace, monospace; font-size: .62rem; color: var(--muted);
    background: var(--bg); border-radius: 5px; padding: .05rem .3rem; flex: 0 0 auto;
  }
  .pad-pen.hot { background: var(--pen); color: #fff; font-weight: 700; }
  /* a close target a finger can actually hit, on both windows */
  .pad-x, .vw-x, #sheet-close {
    border: 1px solid #8883; background: var(--bg); color: var(--muted);
    font-size: 1.1rem; cursor: pointer; line-height: 1; border-radius: 8px;
    min-width: 34px; min-height: 30px; padding: 0 .35rem;
  }
  .pad-x:hover, #sheet-close:hover { color: var(--pen); border-color: var(--pen); }
  #pad-canvas {
    display: block; width: 100%; height: 190px; background: var(--paper);
    border-top: 1px solid #8882; border-bottom: 1px solid #8882;
    touch-action: none; cursor: crosshair;
    /* a ruled sheet, so handwriting stays on a line and reads back */
    background-image: repeating-linear-gradient(
      to bottom, transparent 0 37px, #8882 37px 38px);
  }
  .pad-foot { display: flex; align-items: center; gap: .35rem; padding: .35rem .5rem; }
  /* the class is one control that opens the rest: a row of five was most of
     the footer, for something that is usually left alone */
  #pad-tag {
    flex: 1 1 auto; min-width: 0; border: 1px solid #8883; border-radius: 7px;
    background: var(--bg); color: var(--ink); font: inherit; font-size: .75rem;
    padding: .3rem .4rem; min-height: 34px;
  }
  .pad-acts { display: flex; gap: .25rem; flex: 0 0 auto; }
  .pad-acts button {
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #8883; background: var(--bg); color: var(--muted);
    border-radius: 8px; min-width: 40px; min-height: 34px; cursor: pointer;
  }
  .pad-acts button:hover { color: var(--ink); }
  .pad-acts #pad-clear:hover { color: var(--pen); border-color: var(--pen); }
  .pad-acts .save {
    background: var(--accent); color: #fff; border-color: transparent; min-width: 52px;
  }
  #pad.empty .save { opacity: .5; }
  /* Writing or rubbing out, said plainly, because a pen's side button cannot
     be relied on: it reports differently from device to device and on some it
     reports nothing at all. The button still works where it works, and moves
     these buttons when it does. */
  .pad-mode { display: flex; gap: .2rem; flex: 0 0 auto; }
  .pad-mode[hidden] { display: none; }
  .pad-mode .pm {
    display: flex; align-items: center; gap: .25rem; border: 1px solid #8883;
    background: var(--bg); color: var(--muted); border-radius: 7px;
    padding: .25rem .5rem; font: inherit; font-size: .7rem; cursor: pointer;
    min-height: 32px;
  }
  .pad-mode .pm.on {
    background: var(--pen); color: #fff; border-color: transparent; font-weight: 600;
  }
  .pad-mode .pm[data-mode="write"].on { background: var(--accent); }
  #pad-canvas.erasing { cursor: cell; background-color: color-mix(in srgb, var(--pen) 5%, var(--paper)); }

  /* a corner big enough for a finger, since this is used on a tablet */
  .pad-grip-corner {
    position: absolute; right: 0; bottom: 0; width: 26px; height: 26px;
    cursor: nwse-resize; touch-action: none; z-index: 2;
    background: linear-gradient(135deg, transparent 52%, var(--muted) 52%,
                                var(--muted) 62%, transparent 62%,
                                transparent 72%, var(--muted) 72%,
                                var(--muted) 82%, transparent 82%);
    opacity: .5; border-radius: 0 0 9px 0;
  }
  .pad-grip-corner:hover { opacity: .9; }
  #toast {
    position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); z-index: 40;
    background: var(--ink); color: var(--bg); padding: .5rem .9rem; border-radius: 999px;
    font-size: .8rem; max-width: 90vw;
  }
  #toast[hidden] { display: none; }
  #pages .empty { padding: 2rem; text-align: center; color: var(--muted); font-size: .9rem; }
</style>

<header>
  <a class="back" href="/" title="Back to the board">&larr;</a>
  <h1>{name}</h1>
  <span class="state" id="state">loading</span>
  <span class="grow"></span>
  <a class="chip" href="/paper/{pid}/versions"
     title="This paper as it was, and what changed since">Versions</a>
  <a class="chip" href="/paper/{pid}/edit"
     title="Write the source, with the build beside it">Edit</a>
  <a class="chip" id="fixes-chip" href="/paper/{pid}/feedback" hidden
     title="Every fix proposed for this paper's notes, to choose from">Fixes</a>
  <span class="agent-said" id="agent-said" hidden></span>
  <button id="ask-agent" type="button" hidden
          title="the agent answers the newest round: applies what leaves no choice, proposes the rest">Ask claude</button>
